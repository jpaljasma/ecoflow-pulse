runtime:
  workers:
    defaultPodScheduling:
      # Keep required data-plane workers on the base app-pool placement until a
      # separate request-headroom gate proves stateful nodes can absorb them.
      nodeSelector:
        cloud.google.com/gke-nodepool: app-pool
    ingest:
      enabled: true
      replicaCount: 2
      pdb:
        enabled: true
        minAvailable: 1
    archive:
      enabled: true
      replicaCount: 1
      pdb:
        enabled: true
        minAvailable: 1
    rollup:
      enabled: true
      replicaCount: 1
      pdb:
        enabled: true
        minAvailable: 1
    inference:
      enabled: false
    projection:
      enabled: false
    grpcApi:
      enabled: false
    solarVerification:
      enabled: false
    scheduler:
      enabled: false
    energyApi:
      enabled: false
