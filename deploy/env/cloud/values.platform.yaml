global:
  environment: cloud

scaffold:
  enabled: true
  message: "pulse-platform cloud scaffold"

components:
  nats:
    enabled: true
  cloudnativepg:
    enabled: true
  timescaledb:
    enabled: true
  valkey:
    enabled: true
  keycloak:
    enabled: true
  minio:
    enabled: false
  ingressNginx:
    enabled: true
  certManager:
    enabled: true
  externalSecrets:
    enabled: true
  observabilityLite:
    enabled: false

secretManager:
  enabled: true
  serviceAccount:
    create: true
    name: pulse-platform-gcp-secrets
    annotations:
      iam.gke.io/gcp-service-account: pulse-platform-secrets@ecoflow-pulse-dev-260221-01.iam.gserviceaccount.com
  secretStore:
    create: true
    kind: SecretStore
    name: pulse-platform-gcp-secrets
    projectId: ecoflow-pulse-dev-260221-01
    clusterLocation: us-east1
    clusterName: pulse-cloud
  keycloakSocialExternalSecret:
    enabled: false
    refreshInterval: 1h
    targetSecretName: pulse-platform-keycloak-social-providers
    data:
      googleClientId: pulse-cloud-keycloak-google-client-id
      googleClientSecret: pulse-cloud-keycloak-google-client-secret

runtime:
  publicApp:
    enabled: true
    replicaCount: 2
    pdb:
      enabled: true
      minAvailable: 1
    image:
      repository: us-east1-docker.pkg.dev/ecoflow-pulse-dev-260221-01/ecoflow-pulse/pulse-platform
      tag: main
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
    metrics:
      serviceMonitor:
        enabled: false
        interval: 30s
    env:
      grpcApiAddr: pulse-services-cloud-go-grpc-api.pulse-services.svc.cluster.local:9090
      energyGrpcApiAddr: pulse-services-cloud-go-energy-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      nodeAuthMode: keycloak
      keycloakIssuerUrl: https://pulse.example.com/realms/pulse
      keycloakAudience: pulse-universal-app
      keycloakJwksUrl: http://pulse-platform-cloud-keycloak.pulse-platform.svc.cluster.local/realms/pulse/protocol/openid-connect/certs
      keycloakUserInfoUrl: http://pulse-platform-cloud-keycloak.pulse-platform.svc.cluster.local/realms/pulse/protocol/openid-connect/userinfo
      keycloakAllowMissingJwt: "false"
      publicDir: /app/apps/universal/dist
      realtimeGatewayUpstreamUrl: http://pulse-platform-cloud-realtime-gateway.pulse-platform.svc.cluster.local:8082
      devUserSubject: ""
      publicPreconnectOrigins: "https://pulse.example.com"
      corsAllowedOrigins: "https://pulse.example.com,http://localhost:8081,https://localhost:8081,http://127.0.0.1:8081,https://127.0.0.1:8081"
    ingress:
      enabled: true
      host: pulse.example.com
      proxyReadTimeoutSeconds: 3600
      proxySendTimeoutSeconds: 3600
      tls:
        enabled: true
        secretName: pulse-platform-cloud-tls
        clusterIssuer: letsencrypt-prod
        localSelfSigned: false
      http3:
        enabled: false
  realtimeGateway:
    enabled: true
    replicaCount: 2
    pdb:
      enabled: true
      minAvailable: 1
    image:
      repository: us-east1-docker.pkg.dev/ecoflow-pulse-dev-260221-01/ecoflow-pulse/pulse-realtime-gateway
      tag: main
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8082
      targetPort: 8082
    metrics:
      serviceMonitor:
        enabled: false
        interval: 30s
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      natsURLs: nats://pulse-platform-cloud-nats.pulse-platform.svc.cluster.local:4222
      valkeyAddrs: pulse-platform-cloud-valkey.pulse-platform.svc.cluster.local:26379
      valkeySentinelMasterSet: myprimary
      projectionKeyPrefix: pulse:projection
      telemetrySubjectPrefix: pulse.telemetry
      nodeAuthMode: keycloak
      keycloakIssuerUrl: https://pulse.example.com/realms/pulse
      keycloakAudience: pulse-universal-app
      keycloakJwksUrl: http://pulse-platform-cloud-keycloak.pulse-platform.svc.cluster.local/realms/pulse/protocol/openid-connect/certs
      keycloakUserInfoUrl: http://pulse-platform-cloud-keycloak.pulse-platform.svc.cluster.local/realms/pulse/protocol/openid-connect/userinfo
      keycloakAllowMissingJwt: "false"

nats:
  podTemplate:
    configChecksumAnnotation: true
  config:
    cluster:
      enabled: false
      replicas: 1
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
          storageClassName: standard
  promExporter:
    enabled: false
    podMonitor:
      enabled: false
      patch:
        - op: add
          path: /metadata/labels/release
          value: pulse-platform

cloudnative-pg: {}
cloudnativepgCluster:
  enabled: true
  name: pulse-platform-core
  instances: 1
  enablePDB: false
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 50Gi
    storageClass: standard
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  bootstrap:
    database: pulse
    owner: pulse
    appSecretName: pulse-platform-core-app
    appUser: pulse
    appPassword: replace-me-cloud-db-password
  timescaledb:
    enabled: true
    imageCatalog:
      name: pulse-platform-timescaledb
      major: 18
      image: timescale/timescaledb:latest-pg18@sha256:42ffa71e12b69a7d8ff4fd04c177e4519f66d3c9d1a026e5c4adf296a8168240
    postgresUID: 70
    postgresGID: 70
    postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
cloudnativepgContract:
  enabled: true
  configMapName: pulse-platform-core-contract
  connectionSecretName: pulse-platform-core-connection
  service:
    rw: pulse-platform-core-rw
    ro: pulse-platform-core-ro
    r: pulse-platform-core-r
  port: 5432
  database: pulse

valkey:
  architecture: replication
  auth:
    enabled: false
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
      additionalLabels:
        release: pulse-platform
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: standard
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
  replica:
    replicaCount: 1
    minReadySeconds: 10
    terminationGracePeriodSeconds: 60
    persistence:
      enabled: true
      size: 8Gi
      storageClass: standard
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: node
  pdb:
    create: true
    maxUnavailable: 1
  sentinel:
    enabled: true
    quorum: 1
    automateClusterRecovery: true
    downAfterMilliseconds: 2000
    failoverTimeout: 180000
    parallelSyncs: 1
    replicaSyncCheck: true
    valkeyShutdownWaitFailover: true

keycloak:
  replicaCount: 1
  useHelmHooks: false
  proxyHeaders: xforwarded
  extraEnvVars:
    - name: KC_HOSTNAME
      value: https://pulse.example.com
  resources:
    requests:
      cpu: 150m
      memory: 768Mi
    limits:
      cpu: 1
      memory: 2Gi
  image:
    repository: bitnamilegacy/keycloak
  auth:
    adminUser: admin
    adminPassword: replace-me-keycloak-admin-password
  postgresql:
    enabled: false
  externalDatabase:
    host: pulse-platform-core-rw
    port: 5432
    database: pulse
    existingSecret: pulse-platform-core-app
    existingSecretUserKey: username
    existingSecretPasswordKey: password
  keycloakConfigCli:
    enabled: false
    existingConfigmap: pulse-platform-keycloak-realm-import
    extraEnvVarsSecret: pulse-platform-keycloak-social-providers
    extraEnvVars:
      - name: IMPORT_VARSUBSTITUTION_ENABLED
        value: "true"
    image:
      repository: bitnamilegacy/keycloak-config-cli
    cleanupAfterFinished:
      enabled: true
      seconds: 600

keycloakRealm:
  enabled: true
  configMapName: pulse-platform-keycloak-realm-import
  socialSecretName: pulse-platform-keycloak-social-providers
  realmName: pulse
  universalClient:
    enabled: true
    clientId: pulse-universal-app
    redirectUris:
      - ecoflowpulse://*
      - https://pulse.example.com/*
      - https://localhost/*
      - http://localhost:8081/*
      - https://127.0.0.1/*
      - http://127.0.0.1:8081/*
    webOrigins:
      - https://pulse.example.com
      - https://localhost
      - http://localhost:8081
      - https://127.0.0.1
      - http://127.0.0.1:8081
  google:
    enabled: true
    clientId: ""
    clientSecret: ""
  facebook:
    enabled: false
    clientId: ""
    clientSecret: ""

ingress-nginx:
  controller:
    allowSnippetAnnotations: false
    replicaCount: 2
    minAvailable: 1
    admissionWebhooks:
      patch:
        enabled: false
    service:
      type: LoadBalancer

cert-manager:
  crds:
    enabled: true
  replicaCount: 1
  startupapicheck:
    enabled: false
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1

external-secrets:
  installCRDs: true
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  webhook:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

opentelemetry-collector:
  mode: deployment
  replicaCount: 0
