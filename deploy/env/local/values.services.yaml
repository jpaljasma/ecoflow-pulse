global:
  environment: local

scaffold:
  enabled: false
  message: "pulse-services local runtime"

runtime:
  migrations:
    enabled: false
    namespace: pulse-platform
    db:
      host: pulse-platform-core-rw
      port: 5432
      name: pulse
      sslmode: disable
      credentialsSecretName: pulse-platform-core-app
      usernameKey: username
      passwordKey: password
    policy:
      rolloutEnv: local
      requireBackup: false
      backupRef: ""
      forwardOnly: true
  image:
    repository: ecoflow-pulse/services
    tag: local
    pullPolicy: IfNotPresent
  env:
    controlPlaneDBDSN: "postgres://pulse:pulse-local-dev-password@pulse-platform-core-rw.pulse-platform.svc.cluster.local:5432/pulse?sslmode=disable"
    archiveManifestDBDSN: "postgres://pulse:pulse-local-dev-password@pulse-platform-core-rw.pulse-platform.svc.cluster.local:5432/pulse?sslmode=disable"
    dbSchemaSearchPath: ""
    natsURLs: "nats://pulse-platform-nats.pulse-platform.svc.cluster.local:4222"
    # Local Valkey is sentinel-backed; use the sentinel service so write paths can
    # resolve the current primary instead of pinning a pod hostname.
    valkeyAddrs: "pulse-platform-valkey.pulse-platform.svc.cluster.local:26379"
    valkeySentinelMasterSet: "myprimary"
    grpcAuthMode: "noop"
    archiveObjectEndpoint: "pulse-platform-minio.pulse-platform.svc.cluster.local:9000"
    archiveObjectAccessKey: "minio"
    archiveObjectSecretKey: "minio123"
    archiveObjectBucket: "pulse-telemetry-raw"
    archiveObjectPrefix: "raw"
    archiveObjectRegion: "us-east-1"
    archiveObjectSecure: "false"
    archiveObjectAutoCreateBucket: "true"
  workers:
    ingest:
      enabled: true
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    inference:
      enabled: true
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    projection:
      enabled: true
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    rollup:
      enabled: true
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    archive:
      enabled: true
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    grpcApi:
      enabled: true
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
