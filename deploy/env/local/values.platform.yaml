global:
  environment: local

scaffold:
  enabled: true
  message: "pulse-platform local scaffold"

components:
  nats:
    enabled: true
  cloudnativepg:
    enabled: true
  timescaledb:
    enabled: false
  valkey:
    enabled: true
  keycloak:
    enabled: true
  minio:
    enabled: true
  observabilityLite:
    enabled: false

# Local-first: NATS JetStream enabled, remaining platform components staged.
nats:
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi

cloudnative-pg: {}
cloudnativepgCluster:
  enabled: true
  name: pulse-platform-core
  instances: 2
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  bootstrap:
    database: pulse
    owner: pulse
    appSecretName: pulse-platform-core-app
    appUser: pulse
    appPassword: pulse-local-dev-password
valkey:
  architecture: replication
  auth:
    enabled: false
  primary:
    persistence:
      enabled: false
  replica:
    replicaCount: 3
    persistence:
      enabled: false
  sentinel:
    enabled: true
    quorum: 2
keycloak:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  image:
    repository: bitnamilegacy/keycloak
  auth:
    adminUser: admin
    adminPassword: admin
  postgresql:
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
    auth:
      postgresPassword: postgres
      password: keycloak
    primary:
      persistence:
        enabled: false
minio:
  mode: standalone
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
