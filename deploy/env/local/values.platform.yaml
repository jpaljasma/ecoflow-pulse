global:
  environment: local

scaffold:
  enabled: true
  message: "pulse-platform local scaffold"

components:
  nats:
    enabled: true
  cloudnativepg:
    enabled: true
  timescaledb:
    enabled: true
  valkey:
    enabled: true
  keycloak:
    enabled: true
  minio:
    enabled: true
  ingressNginx:
    enabled: true
  certManager:
    enabled: true
  externalSecrets:
    enabled: false
  observabilityLite:
    enabled: true

runtime:
  publicApp:
    enabled: true
    replicaCount: 2
    image:
      repository: ecoflow-pulse/pulse-platform
      tag: local
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    metrics:
      serviceMonitor:
        enabled: true
        interval: 30s
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      energyGrpcApiAddr: pulse-services-go-energy-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      nodeAuthMode: keycloak
      keycloakIssuerUrl: https://localhost/realms/pulse
      keycloakAudience: pulse-universal-app
      keycloakJwksUrl: http://pulse-platform-keycloak.pulse-platform.svc.cluster.local/realms/pulse/protocol/openid-connect/certs
      keycloakUserInfoUrl: http://pulse-platform-keycloak.pulse-platform.svc.cluster.local/realms/pulse/protocol/openid-connect/userinfo
      keycloakAllowMissingJwt: "false"
      publicDir: /app/apps/universal/dist
      realtimeGatewayUpstreamUrl: http://pulse-platform-realtime-gateway.pulse-platform.svc.cluster.local:8082
      devUserSubject: ""
      publicPreconnectOrigins: ""
      corsAllowedOrigins: "http://localhost:8081,https://localhost:8081,http://127.0.0.1:8081,https://127.0.0.1:8081"
    ingress:
      enabled: true
      host: localhost
      proxyReadTimeoutSeconds: 3600
      proxySendTimeoutSeconds: 3600
      tls:
        enabled: true
        secretName: pulse-platform-local-tls
        clusterIssuer: pulse-platform-local-selfsigned
        localSelfSigned: true
      http3:
        enabled: true
        altSvcMaxAgeSeconds: 86400
        service:
          enabled: true
          type: LoadBalancer
  realtimeGateway:
    enabled: true
    replicaCount: 2
    image:
      repository: ecoflow-pulse/pulse-realtime-gateway
      tag: local
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8082
      targetPort: 8082
    metrics:
      serviceMonitor:
        enabled: true
        interval: 30s
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      natsURLs: nats://pulse-platform-nats.pulse-platform.svc.cluster.local:4222
      valkeyAddrs: pulse-platform-valkey.pulse-platform.svc.cluster.local:26379
      valkeySentinelMasterSet: myprimary
      projectionKeyPrefix: pulse:projection
      telemetrySubjectPrefix: pulse.telemetry
      nodeAuthMode: keycloak
      keycloakIssuerUrl: https://localhost/realms/pulse
      keycloakAudience: pulse-universal-app
      keycloakJwksUrl: http://pulse-platform-keycloak.pulse-platform.svc.cluster.local/realms/pulse/protocol/openid-connect/certs
      keycloakUserInfoUrl: http://pulse-platform-keycloak.pulse-platform.svc.cluster.local/realms/pulse/protocol/openid-connect/userinfo
      keycloakAllowMissingJwt: "false"

# Local-first: NATS JetStream enabled, remaining platform components staged.
nats:
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
  promExporter:
    enabled: true
    podMonitor:
      enabled: true
      patch:
        - op: add
          path: /metadata/labels/release
          value: pulse-platform

cloudnative-pg: {}
cloudnativepgCluster:
  enabled: true
  name: pulse-platform-core
  instances: 2
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  bootstrap:
    database: pulse
    owner: pulse
    appSecretName: pulse-platform-core-app
    appUser: pulse
    appPassword: pulse-local-dev-password
  timescaledb:
    enabled: true
    imageCatalog:
      name: pulse-platform-timescaledb
      major: 18
      image: timescale/timescaledb:latest-pg18@sha256:42ffa71e12b69a7d8ff4fd04c177e4519f66d3c9d1a026e5c4adf296a8168240
    postgresUID: 70
    postgresGID: 70
    postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
cloudnativepgContract:
  enabled: true
  configMapName: pulse-platform-core-contract
  connectionSecretName: pulse-platform-core-connection
  service:
    rw: pulse-platform-core-rw
    ro: pulse-platform-core-ro
    r: pulse-platform-core-r
  port: 5432
  database: pulse
valkey:
  architecture: replication
  auth:
    enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: pulse-platform
  primary:
    persistence:
      enabled: false
  replica:
    replicaCount: 3
    persistence:
      enabled: false
  sentinel:
    enabled: true
    quorum: 2
keycloak:
  replicaCount: 2
  proxyHeaders: xforwarded
  extraEnvVars:
    - name: KC_HOSTNAME
      value: https://localhost
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  image:
    repository: bitnamilegacy/keycloak
  auth:
    adminUser: admin
    adminPassword: admin
  postgresql:
    enabled: false
  externalDatabase:
    host: pulse-platform-core-rw
    port: 5432
    database: pulse
    existingSecret: pulse-platform-core-app
    existingSecretUserKey: username
    existingSecretPasswordKey: password
  keycloakConfigCli:
    enabled: true
    existingConfigmap: pulse-platform-keycloak-realm-import
    extraEnvVarsSecret: pulse-platform-keycloak-social-providers
    extraEnvVars:
      - name: IMPORT_VARSUBSTITUTION_ENABLED
        value: "true"
    image:
      repository: bitnamilegacy/keycloak-config-cli
    cleanupAfterFinished:
      enabled: true
      seconds: 600

keycloakRealm:
  enabled: true
  configMapName: pulse-platform-keycloak-realm-import
  socialSecretName: pulse-platform-keycloak-social-providers
  realmName: pulse
  universalClient:
    enabled: true
    clientId: pulse-universal-app
    redirectUris:
      - ecoflowpulse://*
      - https://localhost/*
      - http://localhost:8081/*
      - https://127.0.0.1/*
      - http://127.0.0.1:8081/*
    webOrigins:
      - https://localhost
      - http://localhost:8081
      - https://127.0.0.1
      - http://127.0.0.1:8081
  google:
    enabled: false
    clientId: "replace-me-google-client-id"
    clientSecret: "replace-me-google-client-secret"
  facebook:
    enabled: false
    clientId: "replace-me-facebook-client-id"
    clientSecret: "replace-me-facebook-client-secret"

minio:
  mode: standalone
  replicas: 1
  rootUser: minio
  rootPassword: minio123
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi

ingress-nginx:
  controller:
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
    replicaCount: 1
    service:
      type: LoadBalancer

cert-manager:
  crds:
    enabled: true
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1

external-secrets:
  installCRDs: true
  replicaCount: 1

kube-prometheus-stack:
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  prometheus:
    enabled: true
  grafana:
    enabled: true

opentelemetry-collector:
  mode: deployment
  replicaCount: 1
