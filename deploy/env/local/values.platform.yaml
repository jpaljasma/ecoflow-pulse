global:
  environment: local

scaffold:
  enabled: true
  message: "pulse-platform local scaffold"

components:
  nats:
    enabled: true
  cloudnativepg:
    enabled: false
  timescaledb:
    enabled: false
  valkey:
    enabled: true
  keycloak:
    enabled: false
  minio:
    enabled: true
  observabilityLite:
    enabled: false

# Local-first: NATS JetStream enabled, remaining platform components staged.
nats:
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi

cloudnative-pg: {}
valkey:
  architecture: replication
  auth:
    enabled: false
  primary:
    persistence:
      enabled: false
  replica:
    replicaCount: 3
    persistence:
      enabled: false
  sentinel:
    enabled: true
    quorum: 2
keycloak: {}
minio:
  mode: standalone
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
