global:
  environment: local

scaffold:
  enabled: true
  message: "pulse-platform local scaffold"

components:
  nats:
    enabled: true
  cloudnativepg:
    enabled: false
  timescaledb:
    enabled: false
  valkey:
    enabled: false
  keycloak:
    enabled: false
  minio:
    enabled: false
  observabilityLite:
    enabled: false

# Local-first: NATS JetStream enabled, remaining platform components staged.
nats:
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi

cloudnative-pg: {}
valkey: {}
keycloak: {}
minio: {}
