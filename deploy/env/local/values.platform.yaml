global:
  environment: local

scaffold:
  enabled: true
  message: "pulse-platform local scaffold"

components:
  nats:
    enabled: true
  cloudnativepg:
    enabled: true
  timescaledb:
    enabled: true
  valkey:
    enabled: true
  keycloak:
    enabled: true
  minio:
    enabled: true
  ingressNginx:
    enabled: false
  certManager:
    enabled: false
  externalSecrets:
    enabled: false
  observabilityLite:
    enabled: false

runtime:
  publicApp:
    enabled: true
    replicaCount: 1
    image:
      repository: ecoflow-pulse/pulse-platform
      tag: local
      pullPolicy: IfNotPresent
    service:
      type: LoadBalancer
      port: 80
      targetPort: 8080
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      nodeAuthMode: noop
      publicDir: /app/apps/universal/dist
      realtimeGatewayUpstreamUrl: http://pulse-platform-realtime-gateway.pulse-platform.svc.cluster.local:8082
      devUserSubject: jpaljasma@gmail.com
  realtimeGateway:
    enabled: true
    replicaCount: 1
    image:
      repository: ecoflow-pulse/pulse-realtime-gateway
      tag: local
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8082
      targetPort: 8082
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      natsURLs: nats://pulse-platform-nats.pulse-platform.svc.cluster.local:4222
      valkeyAddrs: pulse-platform-valkey-node-0.pulse-platform-valkey-headless.pulse-platform.svc.cluster.local:6379
      projectionKeyPrefix: pulse:projection
      telemetrySubjectPrefix: pulse.telemetry
      nodeAuthMode: noop

# Local-first: NATS JetStream enabled, remaining platform components staged.
nats:
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi

cloudnative-pg: {}
cloudnativepgCluster:
  enabled: true
  name: pulse-platform-core
  instances: 2
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  bootstrap:
    database: pulse
    owner: pulse
    appSecretName: pulse-platform-core-app
    appUser: pulse
    appPassword: pulse-local-dev-password
  timescaledb:
    enabled: true
    imageCatalog:
      name: pulse-platform-timescaledb
      major: 18
      image: timescale/timescaledb:latest-pg18@sha256:42ffa71e12b69a7d8ff4fd04c177e4519f66d3c9d1a026e5c4adf296a8168240
    postgresUID: 70
    postgresGID: 70
    postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
cloudnativepgContract:
  enabled: true
  configMapName: pulse-platform-core-contract
  connectionSecretName: pulse-platform-core-connection
  service:
    rw: pulse-platform-core-rw
    ro: pulse-platform-core-ro
    r: pulse-platform-core-r
  port: 5432
  database: pulse
valkey:
  architecture: replication
  auth:
    enabled: false
  primary:
    persistence:
      enabled: false
  replica:
    replicaCount: 3
    persistence:
      enabled: false
  sentinel:
    enabled: true
    quorum: 2
keycloak:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  image:
    repository: bitnamilegacy/keycloak
  auth:
    adminUser: admin
    adminPassword: admin
  postgresql:
    enabled: false
  externalDatabase:
    host: pulse-platform-core-rw
    port: 5432
    database: pulse
    existingSecret: pulse-platform-core-app
    existingSecretUserKey: username
    existingSecretPasswordKey: password
  keycloakConfigCli:
    enabled: true
    existingConfigmap: pulse-platform-keycloak-realm-import
    extraEnvVarsSecret: pulse-platform-keycloak-social-providers
    image:
      repository: bitnamilegacy/keycloak-config-cli
    cleanupAfterFinished:
      enabled: true
      seconds: 600

keycloakRealm:
  enabled: true
  configMapName: pulse-platform-keycloak-realm-import
  socialSecretName: pulse-platform-keycloak-social-providers
  realmName: pulse
  google:
    enabled: false
    clientId: "replace-me-google-client-id"
    clientSecret: "replace-me-google-client-secret"
  facebook:
    enabled: false
    clientId: "replace-me-facebook-client-id"
    clientSecret: "replace-me-facebook-client-secret"

minio:
  mode: standalone
  replicas: 1
  rootUser: minio
  rootPassword: minio123
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi

ingress-nginx:
  controller:
    replicaCount: 1
    service:
      type: ClusterIP

cert-manager:
  crds:
    enabled: true
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1

external-secrets:
  installCRDs: true
  replicaCount: 1

kube-prometheus-stack:
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  prometheus:
    enabled: true
  grafana:
    enabled: true

opentelemetry-collector:
  mode: deployment
  replicaCount: 1
