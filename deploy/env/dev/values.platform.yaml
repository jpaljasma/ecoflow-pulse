global:
  environment: dev

scaffold:
  enabled: true
  message: "pulse-platform dev scaffold"

runtime:
  publicApp:
    enabled: true
    replicaCount: 2
    service:
      type: ClusterIP
    env:
      publicPreconnectOrigins: ""
      corsAllowedOrigins: "http://localhost:8081,https://localhost:8081,http://127.0.0.1:8081,https://127.0.0.1:8081"
    ingress:
      enabled: true
      host: pulse.dev.local
      proxyReadTimeoutSeconds: 3600
      proxySendTimeoutSeconds: 3600
      tls:
        enabled: false
        secretName: pulse-platform-dev-tls
        clusterIssuer: ""
        localSelfSigned: false
      http3:
        # Dev keeps HTTP/3 opt-in until a real issuer/domain + UDP 443 edge is
        # intentionally being exercised.
        enabled: false
        altSvcMaxAgeSeconds: 86400
        service:
          enabled: true
          type: ClusterIP
  realtimeGateway:
    enabled: true
    replicaCount: 2

components:
  nats:
    enabled: false
  cloudnativepg:
    enabled: false
  timescaledb:
    enabled: false
  valkey:
    enabled: false
  keycloak:
    enabled: false
  minio:
    enabled: false
  ingressNginx:
    enabled: true
  certManager:
    enabled: true
  externalSecrets:
    enabled: true
  observabilityLite:
    enabled: true

# Dev environment enablement will be staged after local validation.
nats:
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi

cloudnative-pg: {}
valkey: {}
keycloak: {}
keycloakRealm:
  enabled: false
  configMapName: pulse-platform-keycloak-realm-import
  socialSecretName: pulse-platform-keycloak-social-providers
  realmName: pulse
  google:
    enabled: false
    clientId: ""
    clientSecret: ""
  facebook:
    enabled: false
    clientId: ""
    clientSecret: ""
minio:
  rootUser: minio
  rootPassword: minio123
ingress-nginx:
  controller:
    allowSnippetAnnotations: false
    replicaCount: 1
    service:
      type: ClusterIP
cert-manager:
  crds:
    enabled: true
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1
external-secrets:
  installCRDs: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
kube-prometheus-stack:
  crds:
    enabled: true
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  coreDns:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  grafana:
    enabled: true
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 2d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
