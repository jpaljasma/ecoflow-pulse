fullnameOverride: argocd

global:
  domain: argocd.dev.local

configs:
  params:
    # Use port-forward/cluster-internal access in cost-min dev unless ingress is explicitly enabled.
    server.insecure: true

server:
  service:
    type: ClusterIP

controller:
  replicas: 1
  extraArgs:
    - --repo-server-timeout-seconds=300

repoServer:
  replicas: 1
  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: "300"

applicationSet:
  replicas: 1

dex:
  enabled: false

notifications:
  enabled: false

redis:
  enabled: true

redis-ha:
  enabled: false
