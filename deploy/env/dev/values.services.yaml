global:
  environment: dev

scaffold:
  enabled: true
  message: "pulse-services dev scaffold"

runtime:
  env:
    dbSchemaSearchPath: ""
  migrations:
    enabled: false
    namespace: pulse-platform
    db:
      host: pulse-platform-core-rw
      port: 5432
      name: pulse
      sslmode: disable
      credentialsSecretName: pulse-platform-core-app
      usernameKey: username
      passwordKey: password
    policy:
      rolloutEnv: dev
      requireBackup: false
      backupRef: ""
      forwardOnly: true
  workers:
    ingest:
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    inference:
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    projection:
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    rollup:
      replicaCount: 1
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    archive:
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    grpcApi:
      enabled: true
      replicaCount: 3
      solarForecastVerificationInterval: "0s"
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    solarVerification:
      enabled: true
    scheduler:
      enabled: true
      replicaCount: 1
      metrics:
        serviceMonitor:
          enabled: true
    energyApi:
      enabled: true
      replicaCount: 3
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
