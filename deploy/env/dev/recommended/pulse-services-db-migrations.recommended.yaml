runtime:
  migrations:
    enabled: true
    namespace: pulse-platform
    db:
      host: pulse-platform-core-rw
      port: 5432
      name: pulse
      sslmode: disable
      credentialsSecretName: pulse-platform-core-app
      usernameKey: username
      passwordKey: password
    policy:
      rolloutEnv: dev
      requireBackup: false
      backupRef: ""
      forwardOnly: true
