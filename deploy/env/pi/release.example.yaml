# Copy this file to a local path such as /etc/pulse-appliance/release.yaml and
# replace every placeholder before running the appliance installer. Do not commit
# the filled-in file.

runtime:
  publicApp:
    image:
      repository: ghcr.io/<owner-or-org>/pulse-platform
      tag: ""
      digest: sha256:<public-app-image-digest>
      pullPolicy: IfNotPresent
  realtimeGateway:
    image:
      repository: ghcr.io/<owner-or-org>/pulse-realtime-gateway
      tag: ""
      digest: sha256:<realtime-gateway-image-digest>
      pullPolicy: IfNotPresent
  image:
    repository: ghcr.io/<owner-or-org>/services
    tag: ""
    digest: sha256:<services-image-digest>
    pullPolicy: IfNotPresent
  gcsCredentials:
    enabled: true
    secretName: pulse-services-gcs-credentials
    secretKey: key.json
    fileName: key.json
    mountPath: /var/run/pulse-gcs
