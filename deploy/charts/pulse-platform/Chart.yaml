apiVersion: v2
name: pulse-platform
description: EcoFlow Pulse platform dependencies umbrella chart (scaffold)
type: application
version: 0.1.0
appVersion: "0.1.0"
icon: "https://raw.githubusercontent.com/jpaljasma/ecoflow-pulse/main/apps/universal/public/ecoflow_brand_assets/ecoflow_mark_256.png"
dependencies:
  - name: nats
    repository: https://nats-io.github.io/k8s/helm/charts/
    version: "2.12.4"
    condition: components.nats.enabled
  - name: cloudnative-pg
    repository: https://cloudnative-pg.github.io/charts
    version: "0.27.1"
    condition: components.cloudnativepg.enabled
  - name: valkey
    repository: https://charts.bitnami.com/bitnami
    version: "5.3.0"
    condition: components.valkey.enabled
  - name: keycloak
    repository: https://charts.bitnami.com/bitnami
    version: "25.2.0"
    condition: components.keycloak.enabled
  - name: minio
    repository: https://charts.min.io/
    version: "5.4.0"
    condition: components.minio.enabled
  - name: ingress-nginx
    repository: https://kubernetes.github.io/ingress-nginx
    version: "4.14.3"
    condition: components.ingressNginx.enabled
  - name: cert-manager
    repository: https://charts.jetstack.io
    version: "v1.19.3"
    condition: components.certManager.enabled
  - name: external-secrets
    repository: https://charts.external-secrets.io
    version: "2.0.1"
    condition: components.externalSecrets.enabled
  - name: kube-prometheus-stack
    repository: https://prometheus-community.github.io/helm-charts
    version: "82.2.0"
    condition: components.observabilityLite.enabled
  - name: opentelemetry-collector
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: "0.145.0"
    condition: components.observabilityLite.enabled
