{{- if and .Values.components.keycloak.enabled .Values.keycloakRealm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.keycloakRealm.configMapName | quote }}
  labels:
    app.kubernetes.io/name: pulse-platform
    app.kubernetes.io/part-of: ecoflow-pulse
data:
  realm-pulse.yaml: |-
    realm: {{ .Values.keycloakRealm.realmName | quote }}
    enabled: true
    displayName: "EcoFlow Pulse"
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    registrationAllowed: false
    verifyEmail: true
    identityProviders:
      - alias: "google"
        providerId: "google"
        enabled: {{ .Values.keycloakRealm.google.enabled }}
        trustEmail: true
        storeToken: false
        firstBrokerLoginFlowAlias: "first broker login"
        config:
          clientId: "$(env:KEYCLOAK_SOCIAL_GOOGLE_CLIENT_ID)"
          clientSecret: "$(env:KEYCLOAK_SOCIAL_GOOGLE_CLIENT_SECRET)"
          defaultScope: "openid email profile"
      - alias: "facebook"
        providerId: "facebook"
        enabled: {{ .Values.keycloakRealm.facebook.enabled }}
        trustEmail: true
        storeToken: false
        firstBrokerLoginFlowAlias: "first broker login"
        config:
          clientId: "$(env:KEYCLOAK_SOCIAL_FACEBOOK_CLIENT_ID)"
          clientSecret: "$(env:KEYCLOAK_SOCIAL_FACEBOOK_CLIENT_SECRET)"
          defaultScope: "public_profile,email"
    clients:
      - clientId: {{ .Values.keycloakRealm.universalClient.clientId | quote }}
        name: "Pulse Universal App"
        enabled: {{ .Values.keycloakRealm.universalClient.enabled }}
        protocol: "openid-connect"
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        fullScopeAllowed: true
        attributes:
          pkce.code.challenge.method: "S256"
        redirectUris:
{{- range .Values.keycloakRealm.universalClient.redirectUris }}
          - {{ . | quote }}
{{- end }}
        webOrigins:
{{- range .Values.keycloakRealm.universalClient.webOrigins }}
          - {{ . | quote }}
{{- end }}
        protocolMappers:
          - name: "pulse-universal-app-audience"
            protocol: "openid-connect"
            protocolMapper: "oidc-audience-mapper"
            consentRequired: false
            config:
              included.client.audience: {{ .Values.keycloakRealm.universalClient.clientId | quote }}
              access.token.claim: "true"
              id.token.claim: "false"
              introspection.token.claim: "true"
          - name: "identity-provider"
            protocol: "openid-connect"
            protocolMapper: "oidc-usersessionmodel-note-mapper"
            consentRequired: false
            config:
              user.session.note: "identity_provider"
              claim.name: "identity_provider"
              jsonType.label: "String"
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
{{- end }}
