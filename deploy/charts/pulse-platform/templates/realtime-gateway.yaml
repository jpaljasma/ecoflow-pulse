{{- if .Values.runtime.realtimeGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse-platform.fullname" . }}-realtime-gateway
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-gateway
spec:
  replicas: {{ .Values.runtime.realtimeGateway.replicaCount }}
  minReadySeconds: {{ .Values.runtime.realtimeGateway.deployment.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.runtime.realtimeGateway.deployment.strategy.maxUnavailable }}
      maxSurge: {{ .Values.runtime.realtimeGateway.deployment.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "pulse-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: realtime-gateway
  template:
    metadata:
      labels:
        {{- include "pulse-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: realtime-gateway
    spec:
      terminationGracePeriodSeconds: {{ .Values.runtime.realtimeGateway.deployment.terminationGracePeriodSeconds }}
      containers:
        - name: realtime-gateway
          image: "{{ .Values.runtime.realtimeGateway.image.repository }}:{{ .Values.runtime.realtimeGateway.image.tag }}"
          imagePullPolicy: {{ .Values.runtime.realtimeGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.runtime.realtimeGateway.service.targetPort }}
          env:
            - name: PULSE_REALTIME_GATEWAY_HOST
              value: "0.0.0.0"
            - name: PULSE_REALTIME_GATEWAY_PORT
              value: {{ .Values.runtime.realtimeGateway.service.targetPort | quote }}
            - name: GRPC_API_ADDR
              value: {{ .Values.runtime.realtimeGateway.env.grpcApiAddr | quote }}
            - name: GRPC_API_DEADLINE_MS
              value: {{ .Values.runtime.realtimeGateway.env.grpcDeadlineMs | quote }}
            - name: NATS_URLS
              value: {{ .Values.runtime.realtimeGateway.env.natsURLs | quote }}
            - name: VALKEY_ADDRS
              value: {{ .Values.runtime.realtimeGateway.env.valkeyAddrs | quote }}
            - name: VALKEY_SENTINEL_MASTER_SET
              value: {{ .Values.runtime.realtimeGateway.env.valkeySentinelMasterSet | quote }}
            - name: PROJECTION_KEY_PREFIX
              value: {{ .Values.runtime.realtimeGateway.env.projectionKeyPrefix | quote }}
            - name: TELEMETRY_SUBJECT_PREFIX
              value: {{ .Values.runtime.realtimeGateway.env.telemetrySubjectPrefix | quote }}
            - name: NODE_AUTH_MODE
              value: {{ .Values.runtime.realtimeGateway.env.nodeAuthMode | quote }}
            - name: KEYCLOAK_ISSUER_URL
              value: {{ .Values.runtime.realtimeGateway.env.keycloakIssuerUrl | quote }}
            - name: KEYCLOAK_AUDIENCE
              value: {{ .Values.runtime.realtimeGateway.env.keycloakAudience | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.runtime.realtimeGateway.env.keycloakJwksUrl | quote }}
            - name: KEYCLOAK_ALLOW_MISSING_JWT
              value: {{ .Values.runtime.realtimeGateway.env.keycloakAllowMissingJwt | quote }}
          resources:
            {{- toYaml .Values.runtime.realtimeGateway.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.runtime.realtimeGateway.deployment.preStopSleepSeconds }}
          {{- if .Values.runtime.realtimeGateway.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.runtime.realtimeGateway.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runtime.realtimeGateway.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.runtime.realtimeGateway.startupProbe.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse-platform.fullname" . }}-realtime-gateway
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-gateway
spec:
  type: {{ .Values.runtime.realtimeGateway.service.type }}
  selector:
    {{- include "pulse-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-gateway
  ports:
    - name: http
      port: {{ .Values.runtime.realtimeGateway.service.port }}
      targetPort: http
---
{{- if and .Values.components.observabilityLite.enabled .Values.runtime.realtimeGateway.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pulse-platform.fullname" . }}-realtime-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-gateway
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      {{- include "pulse-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: realtime-gateway
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: {{ .Values.runtime.realtimeGateway.metrics.path }}
      interval: {{ .Values.runtime.realtimeGateway.metrics.serviceMonitor.interval }}
{{- end }}
---
{{- if and .Values.runtime.realtimeGateway.pdb.enabled (gt (int .Values.runtime.realtimeGateway.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pulse-platform.fullname" . }}-realtime-gateway
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-gateway
spec:
  minAvailable: {{ .Values.runtime.realtimeGateway.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pulse-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: realtime-gateway
{{- end }}
{{- end }}
