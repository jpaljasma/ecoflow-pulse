{{- if .Values.runtime.realtimeGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse-platform.fullname" . }}-realtime-gateway
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-gateway
spec:
  replicas: {{ .Values.runtime.realtimeGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "pulse-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: realtime-gateway
  template:
    metadata:
      labels:
        {{- include "pulse-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: realtime-gateway
    spec:
      containers:
        - name: realtime-gateway
          image: "{{ .Values.runtime.realtimeGateway.image.repository }}:{{ .Values.runtime.realtimeGateway.image.tag }}"
          imagePullPolicy: {{ .Values.runtime.realtimeGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.runtime.realtimeGateway.service.targetPort }}
          env:
            - name: PULSE_REALTIME_GATEWAY_HOST
              value: "0.0.0.0"
            - name: PULSE_REALTIME_GATEWAY_PORT
              value: {{ .Values.runtime.realtimeGateway.service.targetPort | quote }}
            - name: GRPC_API_ADDR
              value: {{ .Values.runtime.realtimeGateway.env.grpcApiAddr | quote }}
            - name: GRPC_API_DEADLINE_MS
              value: {{ .Values.runtime.realtimeGateway.env.grpcDeadlineMs | quote }}
            - name: NATS_URLS
              value: {{ .Values.runtime.realtimeGateway.env.natsURLs | quote }}
            - name: VALKEY_ADDRS
              value: {{ .Values.runtime.realtimeGateway.env.valkeyAddrs | quote }}
            - name: VALKEY_SENTINEL_MASTER_SET
              value: {{ .Values.runtime.realtimeGateway.env.valkeySentinelMasterSet | quote }}
            - name: PROJECTION_KEY_PREFIX
              value: {{ .Values.runtime.realtimeGateway.env.projectionKeyPrefix | quote }}
            - name: TELEMETRY_SUBJECT_PREFIX
              value: {{ .Values.runtime.realtimeGateway.env.telemetrySubjectPrefix | quote }}
            - name: NODE_AUTH_MODE
              value: {{ .Values.runtime.realtimeGateway.env.nodeAuthMode | quote }}
          resources:
            {{- toYaml .Values.runtime.realtimeGateway.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse-platform.fullname" . }}-realtime-gateway
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-gateway
spec:
  type: {{ .Values.runtime.realtimeGateway.service.type }}
  selector:
    {{- include "pulse-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: realtime-gateway
  ports:
    - name: http
      port: {{ .Values.runtime.realtimeGateway.service.port }}
      targetPort: http
{{- end }}
