{{- $cnpgCRD := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "clusters.postgresql.cnpg.io" -}}
{{- if and .Values.components.cloudnativepg.enabled .Values.cloudnativepgCluster.enabled $cnpgCRD }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cloudnativepgCluster.name | quote }}
  labels:
    app.kubernetes.io/name: pulse-platform
    app.kubernetes.io/part-of: ecoflow-pulse
spec:
  instances: {{ .Values.cloudnativepgCluster.instances }}
  bootstrap:
    initdb:
      database: {{ .Values.cloudnativepgCluster.bootstrap.database | quote }}
      owner: {{ .Values.cloudnativepgCluster.bootstrap.owner | quote }}
      secret:
        name: {{ .Values.cloudnativepgCluster.bootstrap.appSecretName | quote }}
  resources:
    requests:
      cpu: {{ .Values.cloudnativepgCluster.resources.requests.cpu | quote }}
      memory: {{ .Values.cloudnativepgCluster.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.cloudnativepgCluster.resources.limits.cpu | quote }}
      memory: {{ .Values.cloudnativepgCluster.resources.limits.memory | quote }}
  storage:
    size: {{ .Values.cloudnativepgCluster.storage.size | quote }}
{{- end }}
