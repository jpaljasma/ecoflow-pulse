{{- if .Values.runtime.publicApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse-platform.fullname" . }}-public-app
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-app
spec:
  replicas: {{ .Values.runtime.publicApp.replicaCount }}
  minReadySeconds: {{ .Values.runtime.publicApp.deployment.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.runtime.publicApp.deployment.strategy.maxUnavailable }}
      maxSurge: {{ .Values.runtime.publicApp.deployment.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "pulse-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: public-app
  template:
    metadata:
      labels:
        {{- include "pulse-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: public-app
    spec:
      terminationGracePeriodSeconds: {{ .Values.runtime.publicApp.deployment.terminationGracePeriodSeconds }}
      {{- with .Values.runtime.publicApp.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtime.publicApp.scheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtime.publicApp.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtime.publicApp.scheduling.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: public-app
          image: "{{ .Values.runtime.publicApp.image.repository }}:{{ .Values.runtime.publicApp.image.tag }}"
          imagePullPolicy: {{ .Values.runtime.publicApp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.runtime.publicApp.service.targetPort }}
          env:
            - name: PULSE_PLATFORM_HOST
              value: "0.0.0.0"
            - name: PULSE_PLATFORM_PORT
              value: {{ .Values.runtime.publicApp.service.targetPort | quote }}
            - name: PULSE_PLATFORM_PUBLIC_DIR
              value: {{ .Values.runtime.publicApp.env.publicDir | quote }}
            - name: GRPC_API_ADDR
              value: {{ .Values.runtime.publicApp.env.grpcApiAddr | quote }}
            - name: ENERGY_GRPC_API_ADDR
              value: {{ .Values.runtime.publicApp.env.energyGrpcApiAddr | quote }}
            - name: GRPC_API_DEADLINE_MS
              value: {{ .Values.runtime.publicApp.env.grpcDeadlineMs | quote }}
            - name: REALTIME_GATEWAY_UPSTREAM_URL
              value: {{ .Values.runtime.publicApp.env.realtimeGatewayUpstreamUrl | quote }}
            - name: NODE_AUTH_MODE
              value: {{ .Values.runtime.publicApp.env.nodeAuthMode | quote }}
            - name: KEYCLOAK_ISSUER_URL
              value: {{ .Values.runtime.publicApp.env.keycloakIssuerUrl | quote }}
            - name: KEYCLOAK_AUDIENCE
              value: {{ .Values.runtime.publicApp.env.keycloakAudience | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ .Values.runtime.publicApp.env.keycloakJwksUrl | quote }}
            - name: KEYCLOAK_USERINFO_URL
              value: {{ .Values.runtime.publicApp.env.keycloakUserInfoUrl | quote }}
            - name: KEYCLOAK_ALLOW_MISSING_JWT
              value: {{ .Values.runtime.publicApp.env.keycloakAllowMissingJwt | quote }}
            - name: PULSE_PLATFORM_DEV_SUBJECT
              value: {{ .Values.runtime.publicApp.env.devUserSubject | quote }}
            - name: PULSE_PLATFORM_PUBLIC_PRECONNECT_ORIGINS
              value: {{ .Values.runtime.publicApp.env.publicPreconnectOrigins | quote }}
            - name: PULSE_PLATFORM_CORS_ALLOWED_ORIGINS
              value: {{ .Values.runtime.publicApp.env.corsAllowedOrigins | quote }}
          resources:
            {{- toYaml .Values.runtime.publicApp.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.runtime.publicApp.deployment.preStopSleepSeconds }}
          {{- if .Values.runtime.publicApp.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.runtime.publicApp.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runtime.publicApp.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.runtime.publicApp.startupProbe.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse-platform.fullname" . }}-public-app
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-app
spec:
  type: {{ .Values.runtime.publicApp.service.type }}
  selector:
    {{- include "pulse-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: public-app
  ports:
    - name: http
      port: {{ .Values.runtime.publicApp.service.port }}
      targetPort: http
---
{{- if and .Values.components.observabilityLite.enabled .Values.runtime.publicApp.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pulse-platform.fullname" . }}-public-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-app
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      {{- include "pulse-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: public-app
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: {{ .Values.runtime.publicApp.metrics.path }}
      interval: {{ .Values.runtime.publicApp.metrics.serviceMonitor.interval }}
{{- end }}
---
{{- if .Values.runtime.publicApp.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pulse-platform.fullname" . }}-public-app
  labels:
    {{- include "pulse-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-app
spec:
  {{- include "pulse-platform.pdbSpec" .Values.runtime.publicApp.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "pulse-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: public-app
{{- end }}
{{- end }}
