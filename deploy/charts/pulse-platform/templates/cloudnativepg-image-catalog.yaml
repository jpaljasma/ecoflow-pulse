{{- $cnpgImageCatalogCRD := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "imagecatalogs.postgresql.cnpg.io" -}}
{{- if and .Values.components.cloudnativepg.enabled .Values.components.timescaledb.enabled .Values.cloudnativepgCluster.enabled .Values.cloudnativepgCluster.timescaledb.enabled $cnpgImageCatalogCRD }}
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: {{ .Values.cloudnativepgCluster.timescaledb.imageCatalog.name | quote }}
  labels:
    app.kubernetes.io/name: pulse-platform
    app.kubernetes.io/part-of: ecoflow-pulse
spec:
  images:
    - major: {{ .Values.cloudnativepgCluster.timescaledb.imageCatalog.major }}
      image: {{ .Values.cloudnativepgCluster.timescaledb.imageCatalog.image | quote }}
{{- end }}
