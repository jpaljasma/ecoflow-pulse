{{- if and .Values.gkeStorageClasses.enabled .Values.gkeStorageClasses.items }}
{{- range $index, $item := .Values.gkeStorageClasses.items }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $item.name | quote }}
  {{- with $item.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
provisioner: {{ $item.provisioner | default "pd.csi.storage.gke.io" | quote }}
allowVolumeExpansion: {{ $item.allowVolumeExpansion | default true }}
reclaimPolicy: {{ $item.reclaimPolicy | default "Delete" | quote }}
volumeBindingMode: {{ $item.volumeBindingMode | default "WaitForFirstConsumer" | quote }}
{{- with $item.parameters }}
parameters:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $item.allowedTopologies }}
allowedTopologies:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
