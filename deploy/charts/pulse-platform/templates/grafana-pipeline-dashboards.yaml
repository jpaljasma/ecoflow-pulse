          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 56},
          "id": 17,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [
            {
              "expr": "sum(rate(pulse_solar_forecast_training_hours_total{namespace=\"$namespace\",result=\"success\"}[5m]))",
