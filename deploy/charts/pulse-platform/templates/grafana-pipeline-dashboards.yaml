{{- if .Values.components.observabilityLite.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse-platform.fullname" . }}-grafana-dashboard-pipeline-overview
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: {{ include "pulse-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  pulse-pipeline-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (service, outcome) (rate(pulse_worker_messages_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "{{"{{"}}service{{"}}"}} {{"{{"}}outcome{{"}}"}}",
              "refId": "A"
            }
          ],
          "title": "Worker Message Rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(pulse_worker_process_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "{{"{{"}}service{{"}}"}} p95",
              "refId": "A"
            }
          ],
          "title": "Worker Process Duration p95",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (service) (pulse_worker_inflight_messages{namespace=\"$namespace\"})",
              "legendFormat": "{{"{{"}}service{{"}}"}}",
              "refId": "A"
            }
          ],
          "title": "Inflight Worker Handlers",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "pulse_worker_last_flush_records{namespace=\"$namespace\",service=\"pulse-services-go-archive-metrics\"}",
              "legendFormat": "records",
              "refId": "A"
            },
            {
              "expr": "pulse_worker_last_flush_bytes{namespace=\"$namespace\",service=\"pulse-services-go-archive-metrics\"}",
              "legendFormat": "bytes",
              "refId": "B"
            }
          ],
          "title": "Archive Last Flush Size",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",pod=~\"pulse-services-go-(ingest|projection|rollup|archive|inference).*\",container!=\"\",image!=\"\"}[5m]))",
              "legendFormat": "{{"{{"}}pod{{"}}"}}",
              "refId": "A"
            }
          ],
          "title": "Pipeline Pod CPU",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 6,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\",pod=~\"pulse-services-go-(ingest|projection|rollup|archive|inference).*\",container!=\"\",image!=\"\"})",
              "legendFormat": "{{"{{"}}pod{{"}}"}}",
              "refId": "A"
            }
          ],
          "title": "Pipeline Pod Memory",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["pulse", "pipeline"],
      "templating": {
        "list": [
          {
            "current": {"selected": true, "text": "pulse-services", "value": "pulse-services"},
            "hide": 0,
            "label": "Namespace",
            "name": "namespace",
            "options": [],
            "query": "pulse-services",
            "type": "constant"
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "title": "Pulse Pipeline Overview",
      "uid": "pulse-pipeline-overview",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse-platform.fullname" . }}-grafana-dashboard-ingest-health
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: {{ include "pulse-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  pulse-ingest-health.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [
            {
              "expr": "max(ingest_unassigned_active_devices{namespace=\"$namespace\"})",
              "refId": "A"
            }
          ],
          "title": "Unassigned Active Devices",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [
            {
              "expr": "max(ingest_reconcile_duration_p95_seconds{namespace=\"$namespace\"})",
              "refId": "A"
            }
          ],
          "title": "Reconcile p95",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [
            {
              "expr": "max(ingest_lease_acquire_latency_p95_seconds{namespace=\"$namespace\"})",
              "refId": "A"
            }
          ],
          "title": "Lease Acquire p95",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "max(ingest_reconcile_duration_p95_seconds{namespace=\"$namespace\"})",
              "legendFormat": "reconcile p95",
              "refId": "A"
            },
            {
              "expr": "max(ingest_poll_interval_seconds{namespace=\"$namespace\"})",
              "legendFormat": "poll interval",
              "refId": "B"
            }
          ],
          "title": "Reconcile p95 vs Poll Interval",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 8},
          "id": 5,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (outcome) (rate(pulse_worker_messages_total{namespace=\"$namespace\",service=\"pulse-services-go-ingest-metrics\"}[5m]))",
              "legendFormat": "{{"{{"}}outcome{{"}}"}}",
              "refId": "A"
            }
          ],
          "title": "Ingest Worker Message Outcomes",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["pulse", "ingest"],
      "templating": {
        "list": [
          {
            "current": {"selected": true, "text": "pulse-services", "value": "pulse-services"},
            "hide": 0,
            "label": "Namespace",
            "name": "namespace",
            "options": [],
            "query": "pulse-services",
            "type": "constant"
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "title": "Pulse Ingest Health",
      "uid": "pulse-ingest-health",
      "version": 1
    }
