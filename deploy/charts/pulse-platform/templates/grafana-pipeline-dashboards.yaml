          "id": 2,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(redis_memory_used_bytes)", "refId": "A"}],
          "title": "Valkey Memory Used",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(cnpg_collector_up)", "refId": "A"}],
          "title": "CNPG Instances Up",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "sum(rate(nats_varz_in_msgs[5m]))", "legendFormat": "in msgs/s", "refId": "A"},
            {"expr": "sum(rate(nats_varz_out_msgs[5m]))", "legendFormat": "out msgs/s", "refId": "B"}
          ],
          "title": "NATS Message Throughput",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 5,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "sum by (consumer_name) (nats_consumer_num_ack_pending)", "legendFormat": "{{"{{"}}consumer_name{{"}}"}}", "refId": "A"}
          ],
          "title": "NATS Consumer Ack Pending",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 6,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "sum(rate(redis_commands_processed_total[5m]))", "legendFormat": "commands/s", "refId": "A"},
            {"expr": "sum(redis_connected_clients)", "legendFormat": "clients", "refId": "B"}
          ],
          "title": "Valkey Activity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 7,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "max(cnpg_pg_replication_lag)", "legendFormat": "replication lag", "refId": "A"},
            {"expr": "sum(cnpg_backends_waiting_total)", "legendFormat": "backends waiting", "refId": "B"}
          ],
          "title": "CNPG Replication & Waiting",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24},
          "id": 8,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "sum by (datname) (rate(cnpg_pg_stat_database_xact_commit[5m]))", "legendFormat": "{{"{{"}}datname{{"}}"}} commits/s", "refId": "A"},
            {"expr": "sum by (datname) (rate(cnpg_pg_stat_database_xact_rollback[5m]))", "legendFormat": "{{"{{"}}datname{{"}}"}} rollbacks/s", "refId": "B"}
          ],
          "title": "CNPG Transaction Throughput",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["pulse", "infra", "nats", "valkey", "cnpg"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "Pulse Platform Infra",
      "uid": "pulse-platform-infra",
      "version": 1
    }
