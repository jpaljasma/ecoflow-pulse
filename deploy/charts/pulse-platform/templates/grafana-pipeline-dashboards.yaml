apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse-platform.fullname" . }}-grafana-dashboard-grpc-slos
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: {{ include "pulse-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  pulse-grpc-slos.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (grpc_method) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\",grpc_code=\"OK\"}[5m])) / sum by (grpc_method) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\"}[5m]))",
              "legendFormat": "{{"{{"}}grpc_method{{"}}"}}",
              "refId": "A"
            },
            {
              "expr": "vector(0.9999)",
              "legendFormat": "99.99% target",
              "refId": "B"
            }
          ],
          "title": "Availability by gRPC Method",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, grpc_method) (rate(pulse_grpc_server_duration_seconds_bucket{namespace=\"$namespace\",grpc_method=~\"$grpc_method\"}[5m])))",
              "legendFormat": "{{"{{"}}grpc_method{{"}}"}} p95",
              "refId": "A"
            }
          ],
          "title": "Latency p95 by gRPC Method",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 6,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, grpc_method) (rate(pulse_grpc_server_duration_seconds_bucket{namespace=\"$namespace\",grpc_method=~\"$grpc_method\"}[5m])))",
              "legendFormat": "{{"{{"}}grpc_method{{"}}"}} p99",
              "refId": "A"
            }
          ],
          "title": "Latency p99 by gRPC Method",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (grpc_method, grpc_code) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\",grpc_code!=\"OK\"}[5m]))",
              "legendFormat": "{{"{{"}}grpc_method{{"}}"}} {{"{{"}}grpc_code{{"}}"}}",
              "refId": "A"
            }
          ],
          "title": "Errors by gRPC Method",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 4,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "sum by (grpc_method) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\"}[5m]))",
              "legendFormat": "{{"{{"}}grpc_method{{"}}"}}",
              "refId": "A"
            }
          ],
          "title": "Throughput by gRPC Method",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 7,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "expr": "1 - (sum by (grpc_method) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\",grpc_code=\"OK\"}[5m])) / sum by (grpc_method) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\"}[5m])))",
              "legendFormat": "{{"{{"}}grpc_method{{"}}"}} error budget burn",
              "refId": "A"
            },
            {
              "expr": "vector(0.0001)",
              "legendFormat": "0.01% error budget",
              "refId": "B"
            }
          ],
          "title": "Error Budget Consumption by Method",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 24},
          "id": 5,
          "options": {
            "showHeader": true,
            "sortBy": [{"desc": false, "displayName": "grpc_method"}]
          },
          "targets": [
            {
              "expr": "sum by (grpc_method, grpc_code) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\"}[5m]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, grpc_method) (rate(pulse_grpc_server_duration_seconds_bucket{namespace=\"$namespace\",grpc_method=~\"$grpc_method\"}[5m])))",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "sum by (grpc_method) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\",grpc_code=\"OK\"}[5m])) / sum by (grpc_method) (rate(pulse_grpc_server_requests_total{namespace=\"$namespace\",grpc_method=~\"$grpc_method\"}[5m]))",
              "format": "table",
              "instant": true,
              "refId": "C"
            }
          ],
          "title": "gRPC SLO Summary",
          "transformations": [
            {
              "id": "joinByField",
              "options": {"byField": "grpc_method", "mode": "outer"}
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["pulse", "grpc", "slo"],
      "templating": {
        "list": [
          {
            "current": {"selected": true, "text": "pulse-services", "value": "pulse-services"},
            "hide": 0,
            "label": "Namespace",
            "name": "namespace",
            "options": [],
            "query": "pulse-services",
            "type": "constant"
          },
          {
            "allValue": ".*",
            "current": {"selected": true, "text": "All", "value": ".*"},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "definition": "label_values(pulse_grpc_server_requests_total{namespace=\"$namespace\"}, grpc_method)",
            "hide": 0,
            "includeAll": true,
            "label": "gRPC Method",
            "multi": true,
            "name": "grpc_method",
            "options": [],
            "query": {"qryType": 1, "query": "label_values(pulse_grpc_server_requests_total{namespace=\"$namespace\"}, grpc_method)", "refId": "grpc_method"},
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "title": "Pulse gRPC SLOs",
      "uid": "pulse-grpc-slos",
      "version": 1
    }
---
