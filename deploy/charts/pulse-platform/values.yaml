global:
  environment: local
  namespaces:
    platform: pulse-platform
    services: pulse-services

scaffold:
  enabled: true
  message: "pulse-platform scaffold chart"

components:
  nats:
    enabled: false
  cloudnativepg:
    enabled: false
  timescaledb:
    enabled: false
  valkey:
    enabled: false
  keycloak:
    enabled: false
  minio:
    enabled: false
  observabilityLite:
    enabled: false

# Dependency chart values are intentionally minimal in scaffold mode.
# Expand these blocks iteratively when each platform component is wired.
nats: {}
cloudnative-pg: {}
cloudnativepgCluster:
  enabled: false
  name: pulse-platform-core
  instances: 2
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  bootstrap:
    database: pulse
    owner: pulse
    appSecretName: pulse-platform-core-app
    appUser: pulse
    appPassword: pulse-local-dev-password
valkey: {}
keycloak: {}
minio: {}
