global:
  environment: local
  namespaces:
    platform: pulse-platform
    services: pulse-services

scaffold:
  enabled: true
  message: "pulse-platform scaffold chart"

components:
  nats:
    enabled: false
  cloudnativepg:
    enabled: false
  timescaledb:
    enabled: false
  valkey:
    enabled: false
  keycloak:
    enabled: false
  minio:
    enabled: false
  ingressNginx:
    enabled: false
  certManager:
    enabled: false
  externalSecrets:
    enabled: false
  observabilityLite:
    enabled: false

# Dependency chart values are intentionally minimal in scaffold mode.
# Expand these blocks iteratively when each platform component is wired.
nats: {}
cloudnative-pg: {}
cloudnativepgCluster:
  enabled: false
  name: pulse-platform-core
  instances: 2
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  bootstrap:
    database: pulse
    owner: pulse
    appSecretName: pulse-platform-core-app
    appUser: pulse
    appPassword: pulse-local-dev-password
  timescaledb:
    enabled: false
    imageCatalog:
      name: pulse-platform-timescaledb
      major: 18
      image: timescale/timescaledb:latest-pg18@sha256:42ffa71e12b69a7d8ff4fd04c177e4519f66d3c9d1a026e5c4adf296a8168240
    postgresUID: 70
    postgresGID: 70
    postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
cloudnativepgContract:
  enabled: false
  configMapName: pulse-platform-core-contract
  connectionSecretName: pulse-platform-core-connection
  service:
    rw: pulse-platform-core-rw
    ro: pulse-platform-core-ro
    r: pulse-platform-core-r
  port: 5432
  database: pulse
valkey: {}
keycloak: {}
minio: {}
ingress-nginx:
  controller:
    replicaCount: 1
    ingressClassResource:
      default: false
    service:
      type: ClusterIP
cert-manager:
  crds:
    enabled: true
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1
external-secrets:
  installCRDs: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
kube-prometheus-stack:
  crds:
    enabled: true
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  coreDns:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  grafana:
    enabled: true
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 2d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-k8s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
