global:
  environment: local
  namespaces:
    platform: pulse-platform
    services: pulse-services

scaffold:
  enabled: true
  message: "pulse-platform scaffold chart"

components:
  nats:
    enabled: false
  cloudnativepg:
    enabled: false
  timescaledb:
    enabled: false
  valkey:
    enabled: false
  keycloak:
    enabled: false
  minio:
    enabled: false
  ingressNginx:
    enabled: false
  certManager:
    enabled: false
  externalSecrets:
    enabled: false
  observabilityLite:
    enabled: false

runtime:
  publicApp:
    enabled: false
    replicaCount: 1
    image:
      repository: ecoflow-pulse/pulse-platform
      tag: local
      pullPolicy: IfNotPresent
    service:
      type: LoadBalancer
      port: 80
      targetPort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      nodeAuthMode: noop
      publicDir: /app/apps/universal/dist
      realtimeGatewayUpstreamUrl: http://pulse-platform-realtime-gateway.pulse-platform.svc.cluster.local:8082
      devUserSubject: jpaljasma@gmail.com
      publicPreconnectOrigins: ""
    ingress:
      enabled: false
      className: nginx
      host: ""
      annotations: {}
      proxyReadTimeoutSeconds: 3600
      proxySendTimeoutSeconds: 3600
      tls:
        enabled: false
        secretName: ""
        clusterIssuer: ""
        localSelfSigned: false
      http3:
        enabled: false
        altSvcMaxAgeSeconds: 86400
        service:
          enabled: true
          type: ""
  realtimeGateway:
    enabled: false
    replicaCount: 1
    image:
      repository: ecoflow-pulse/pulse-realtime-gateway
      tag: local
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8082
      targetPort: 8082
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      natsURLs: nats://pulse-platform-nats.pulse-platform.svc.cluster.local:4222
      valkeyAddrs: pulse-platform-valkey-node-0.pulse-platform-valkey-headless.pulse-platform.svc.cluster.local:6379
      projectionKeyPrefix: pulse:projection
      telemetrySubjectPrefix: pulse.telemetry
      nodeAuthMode: noop

# Dependency chart values are intentionally minimal in scaffold mode.
# Expand these blocks iteratively when each platform component is wired.
nats: {}
cloudnative-pg: {}
cloudnativepgCluster:
  enabled: false
  name: pulse-platform-core
  instances: 2
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  bootstrap:
    database: pulse
    owner: pulse
    appSecretName: pulse-platform-core-app
    appUser: pulse
    appPassword: pulse-local-dev-password
  timescaledb:
    enabled: false
    imageCatalog:
      name: pulse-platform-timescaledb
      major: 18
      image: timescale/timescaledb:latest-pg18@sha256:42ffa71e12b69a7d8ff4fd04c177e4519f66d3c9d1a026e5c4adf296a8168240
    postgresUID: 70
    postgresGID: 70
    postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
cloudnativepgContract:
  enabled: false
  configMapName: pulse-platform-core-contract
  connectionSecretName: pulse-platform-core-connection
  service:
    rw: pulse-platform-core-rw
    ro: pulse-platform-core-ro
    r: pulse-platform-core-r
  port: 5432
  database: pulse
valkey: {}
keycloak: {}
keycloakRealm:
  enabled: false
  configMapName: pulse-platform-keycloak-realm-import
  socialSecretName: pulse-platform-keycloak-social-providers
  realmName: pulse
  google:
    enabled: false
    clientId: ""
    clientSecret: ""
  facebook:
    enabled: false
    clientId: ""
    clientSecret: ""
minio: {}
ingress-nginx:
  controller:
    allowSnippetAnnotations: false
    replicaCount: 1
    config:
      use-http2: "true"
      use-gzip: "true"
      gzip-level: "5"
      gzip-min-length: "256"
      gzip-types: application/javascript application/json image/svg+xml text/css text/javascript text/plain text/xml
      enable-brotli: "true"
      brotli-level: "5"
      brotli-min-length: "256"
      brotli-types: application/javascript application/json image/svg+xml text/css text/javascript text/plain text/xml
      http3: "true"
      quic-retry: "on"
    ingressClassResource:
      default: false
    service:
      type: ClusterIP
cert-manager:
  crds:
    enabled: true
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1
external-secrets:
  installCRDs: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
kube-prometheus-stack:
  crds:
    enabled: true
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  coreDns:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  grafana:
    enabled: true
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 2d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-k8s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
