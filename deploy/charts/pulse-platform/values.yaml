global:
  environment: local
  namespaces:
    platform: pulse-platform
    services: pulse-services

scaffold:
  enabled: true
  message: "pulse-platform scaffold chart"

components:
  nats:
    enabled: false
  cloudnativepg:
    enabled: false
  timescaledb:
    enabled: false
  valkey:
    enabled: false
  keycloak:
    enabled: false
  minio:
    enabled: false
  ingressNginx:
    enabled: false
  certManager:
    enabled: false
  externalSecrets:
    enabled: false
  observabilityLite:
    enabled: false

secretManager:
  enabled: false
  serviceAccount:
    create: false
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  secretStore:
    create: false
    kind: SecretStore
    name: pulse-platform-gcp-secrets
    projectId: ""
    clusterLocation: ""
    clusterName: ""
  keycloakSocialExternalSecret:
    enabled: false
    refreshInterval: 1h
    targetSecretName: ""
    data:
      googleClientId: ""
      googleClientSecret: ""
      facebookClientId: ""
      facebookClientSecret: ""

runtime:
  publicApp:
    enabled: false
    replicaCount: 1
    deployment:
      minReadySeconds: 10
      terminationGracePeriodSeconds: 45
      preStopSleepSeconds: 15
      strategy:
        maxUnavailable: 0
        maxSurge: 1
    pdb:
      enabled: true
      minAvailable: 1
    image:
      repository: ecoflow-pulse/pulse-platform
      tag: local
      pullPolicy: IfNotPresent
    service:
      type: LoadBalancer
      port: 80
      targetPort: 8080
    metrics:
      path: /metrics
      serviceMonitor:
        enabled: false
        interval: 30s
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 5
      failureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    scheduling:
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      energyGrpcApiAddr: pulse-services-go-energy-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      nodeAuthMode: noop
      keycloakIssuerUrl: ""
      keycloakAudience: ""
      keycloakJwksUrl: ""
      keycloakUserInfoUrl: ""
      keycloakAllowMissingJwt: "false"
      publicDir: /app/apps/universal/dist
      realtimeGatewayUpstreamUrl: http://pulse-platform-realtime-gateway.pulse-platform.svc.cluster.local:8082
      devUserSubject: dev-user@example.com
      publicPreconnectOrigins: ""
      corsAllowedOrigins: ""
      dataPlane: "local"
      bffCacheEnabled: "false"
      bffCacheMaxEntries: "1000"
      weatherForecastCacheTtlMs: "30000"
      weatherYesterdayCacheTtlMs: "300000"
    ingress:
      enabled: false
      className: nginx
      host: ""
      annotations: {}
      proxyReadTimeoutSeconds: 3600
      proxySendTimeoutSeconds: 3600
      tls:
        enabled: false
        secretName: ""
        clusterIssuer: ""
        localSelfSigned: false
      http3:
        enabled: false
        altSvcMaxAgeSeconds: 86400
        service:
          enabled: true
          type: ""
  realtimeGateway:
    enabled: false
    replicaCount: 1
    deployment:
      minReadySeconds: 10
      terminationGracePeriodSeconds: 45
      preStopSleepSeconds: 15
      strategy:
        maxUnavailable: 0
        maxSurge: 1
    pdb:
      enabled: true
      minAvailable: 1
    image:
      repository: ecoflow-pulse/pulse-realtime-gateway
      tag: local
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8082
      targetPort: 8082
    metrics:
      path: /metrics
      serviceMonitor:
        enabled: false
        interval: 30s
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 5
      failureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    scheduling:
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
    env:
      grpcApiAddr: pulse-services-go-grpc-api.pulse-services.svc.cluster.local:9090
      grpcDeadlineMs: "10000"
      natsURLs: nats://pulse-platform-nats.pulse-platform.svc.cluster.local:4222
      valkeyAddrs: pulse-platform-valkey-node-0.pulse-platform-valkey-headless.pulse-platform.svc.cluster.local:6379
      valkeySentinelMasterSet: ""
      projectionKeyPrefix: pulse:projection
      telemetrySubjectPrefix: pulse.telemetry
      nodeAuthMode: noop
      keycloakIssuerUrl: ""
      keycloakAudience: ""
      keycloakJwksUrl: ""
      keycloakUserInfoUrl: ""
      keycloakAllowMissingJwt: "false"

# Dependency chart values are intentionally minimal in scaffold mode.
# Expand these blocks iteratively when each platform component is wired.
nats: {}
gkeStorageClasses:
  enabled: false
  items: []
cloudnative-pg:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
cloudnativepgCluster:
  enabled: false
  name: pulse-platform-core
  instances: 2
  enablePDB: true
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}
  topologySpreadConstraints: []
  bootstrap:
    database: pulse
    owner: pulse
    appSecretName: pulse-platform-core-app
    appUser: pulse
    appPassword: pulse-local-dev-password
  timescaledb:
    enabled: false
    imageCatalog:
      name: pulse-platform-timescaledb
      major: 18
      image: timescale/timescaledb:latest-pg18@sha256:42ffa71e12b69a7d8ff4fd04c177e4519f66d3c9d1a026e5c4adf296a8168240
    postgresUID: 70
    postgresGID: 70
    postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
cloudnativepgContract:
  enabled: false
  configMapName: pulse-platform-core-contract
  connectionSecretName: pulse-platform-core-connection
  service:
    rw: pulse-platform-core-rw
    ro: pulse-platform-core-ro
    r: pulse-platform-core-r
  port: 5432
  database: pulse
valkey:
  architecture: replication
  commonConfiguration: |-
    # Keep AOF as the durable write path so Valkey state can recover after cold restarts.
    appendonly yes
    save ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
  replica:
    replicaCount: 3
    minReadySeconds: 10
    terminationGracePeriodSeconds: 60
    persistence:
      enabled: true
      size: 8Gi
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: node
    pdb:
      create: true
      minAvailable: 2
  sentinel:
    enabled: true
    quorum: 2
    automateClusterRecovery: true
    downAfterMilliseconds: 2000
    failoverTimeout: 180000
    parallelSyncs: 1
    replicaSyncCheck: true
    valkeyShutdownWaitFailover: true
keycloak: {}
keycloakRealm:
  enabled: false
  configMapName: pulse-platform-keycloak-realm-import
  socialSecretName: pulse-platform-keycloak-social-providers
  realmName: pulse
  universalClient:
    enabled: true
    clientId: pulse-universal-app
    redirectUris:
      - ecoflowpulse://*
      - https://localhost/*
      - http://localhost:8081/*
      - https://127.0.0.1/*
      - http://127.0.0.1:8081/*
    webOrigins:
      - https://localhost
      - http://localhost:8081
      - https://127.0.0.1
      - http://127.0.0.1:8081
  google:
    enabled: false
    clientId: ""
    clientSecret: ""
  facebook:
    enabled: false
    clientId: ""
    clientSecret: ""
minio: {}
ingress-nginx:
  controller:
    allowSnippetAnnotations: false
    replicaCount: 1
    config:
      use-http2: "true"
      use-gzip: "true"
      gzip-level: "5"
      gzip-min-length: "256"
      gzip-types: application/javascript application/json image/svg+xml text/css text/javascript text/plain text/xml
      enable-brotli: "true"
      brotli-level: "5"
      brotli-min-length: "256"
      brotli-types: application/javascript application/json image/svg+xml text/css text/javascript text/plain text/xml
      http3: "true"
      quic-retry: "on"
    ingressClassResource:
      default: false
    service:
      type: ClusterIP
cert-manager:
  crds:
    enabled: true
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1
external-secrets:
  installCRDs: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
kube-prometheus-stack:
  crds:
    enabled: true
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  coreDns:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  grafana:
    enabled: true
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 2d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-k8s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
