{{- $workersEnabled := or .Values.runtime.workers.ingest.enabled .Values.runtime.workers.inference.enabled .Values.runtime.workers.projection.enabled .Values.runtime.workers.archive.enabled .Values.runtime.workers.rollup.enabled .Values.runtime.workers.grpcApi.enabled .Values.runtime.workers.energyApi.enabled .Values.runtime.workers.solarVerification.enabled .Values.runtime.workers.scheduler.enabled .Values.runtime.workers.pulseMqttEmulator.enabled -}}
{{- if $workersEnabled }}
{{- $grpcMetricsPort := "" -}}
{{- if .Values.runtime.workers.energyApi.metrics.enabled -}}
{{- $grpcMetricsPort = printf ":%v" .Values.runtime.workers.energyApi.metrics.service.port -}}
{{- else if .Values.runtime.workers.grpcApi.metrics.enabled -}}
{{- $grpcMetricsPort = printf ":%v" .Values.runtime.workers.grpcApi.metrics.service.port -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse-services.fullname" . }}-runtime-env
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
data:
  PULSE_ENV: {{ .Values.global.environment | quote }}
  ECOFLOW_ENV: {{ .Values.runtime.env.ecoflowEnv | quote }}
  ECOFLOW_BASE_URL: {{ .Values.runtime.env.ecoflowBaseUrl | quote }}
  DB_SCHEMA_SEARCH_PATH: {{ .Values.runtime.env.dbSchemaSearchPath | quote }}
  NATS_URLS: {{ .Values.runtime.env.natsURLs | quote }}
  VALKEY_ADDRS: {{ .Values.runtime.env.valkeyAddrs | quote }}
  VALKEY_SENTINEL_MASTER_SET: {{ .Values.runtime.env.valkeySentinelMasterSet | quote }}
  VALKEY_CACHE_CLIENT_SIDE_CACHE_ENABLED: {{ .Values.runtime.env.valkeyCacheClientSideCacheEnabled | quote }}
  VALKEY_CACHE_SIZE_EACH_CONN: {{ .Values.runtime.env.valkeyCacheSizeEachConn | quote }}
  VALKEY_CACHE_CLIENT_TRACKING_OPTIONS: {{ .Values.runtime.env.valkeyCacheClientTrackingOptions | quote }}
  VALKEY_CACHE_ENCRYPTION_KEY_ID: {{ .Values.runtime.env.valkeyCacheEncryptionKeyID | quote }}
  PROJECTION_KEY_PREFIX: {{ .Values.runtime.env.projectionKeyPrefix | quote }}
  WEATHER_KEY_PREFIX: {{ .Values.runtime.env.weatherKeyPrefix | quote }}
  INFERENCE_KEY_PREFIX: {{ .Values.runtime.env.inferenceKeyPrefix | quote }}
  PROVIDER_MQTT_SESSION_CACHE_KEY_PREFIX: {{ .Values.runtime.env.providerMqttSessionCacheKeyPrefix | quote }}
  PROVIDER_MQTT_SESSION_CACHE_IDLE_TTL: {{ .Values.runtime.env.providerMqttSessionCacheIdleTTL | quote }}
  PROVIDER_MQTT_SESSION_CACHE_MAX_AGE: {{ .Values.runtime.env.providerMqttSessionCacheMaxAge | quote }}
  PROVIDER_MQTT_SESSION_CACHE_LOCAL_TTL: {{ .Values.runtime.env.providerMqttSessionCacheLocalTTL | quote }}
  ENERGY_CACHE_KEY_PREFIX: {{ .Values.runtime.env.energyCacheKeyPrefix | quote }}
  ENERGY_CALENDAR_CACHE_LOCAL_TTL: {{ .Values.runtime.env.energyCalendarCacheLocalTTL | quote }}
  ENERGY_PV_PORT_HISTORY_CACHE_LOCAL_TTL: {{ .Values.runtime.env.energyPvPortHistoryCacheLocalTTL | quote }}
  INFERENCE_ENERGY_COMPARISON_CACHE_LOCAL_TTL: {{ .Values.runtime.env.inferenceEnergyComparisonCacheLocalTTL | quote }}
  INFERENCE_CONTEXT_CACHE_LOCAL_TTL: {{ .Values.runtime.env.inferenceContextCacheLocalTTL | quote }}
  {{- with .Values.runtime.env.goMaxProcs }}
  GOMAXPROCS: {{ . | quote }}
  {{- end }}
  {{- with .Values.runtime.env.goMemLimit }}
  GOMEMLIMIT: {{ . | quote }}
  {{- end }}
  GRPC_AUTH_MODE: {{ .Values.runtime.env.grpcAuthMode | quote }}
  KEYCLOAK_ISSUER_URL: {{ .Values.runtime.env.keycloakIssuerUrl | quote }}
  KEYCLOAK_AUDIENCE: {{ .Values.runtime.env.keycloakAudience | quote }}
  KEYCLOAK_JWKS_URL: {{ .Values.runtime.env.keycloakJwksUrl | quote }}
  GRPC_AUTH_ALLOW_MISSING_JWT: {{ .Values.runtime.env.grpcAuthAllowMissingJwt | quote }}
  ARCHIVE_OBJECT_PROVIDER: {{ .Values.runtime.env.archiveObjectProvider | quote }}
  ARCHIVE_OBJECT_ENDPOINT: {{ .Values.runtime.env.archiveObjectEndpoint | quote }}
  ARCHIVE_OBJECT_BUCKET: {{ .Values.runtime.env.archiveObjectBucket | quote }}
  ARCHIVE_OBJECT_PREFIX: {{ .Values.runtime.env.archiveObjectPrefix | quote }}
  ARCHIVE_OBJECT_REGION: {{ .Values.runtime.env.archiveObjectRegion | quote }}
  ARCHIVE_OBJECT_GCS_PROJECT_ID: {{ .Values.runtime.env.archiveObjectGCSProjectID | quote }}
  ARCHIVE_OBJECT_SECURE: {{ .Values.runtime.env.archiveObjectSecure | quote }}
  ARCHIVE_OBJECT_AUTO_CREATE_BUCKET: {{ .Values.runtime.env.archiveObjectAutoCreateBucket | quote }}
  INGEST_NATS_JS_REPLICAS: {{ .Values.runtime.env.ingestNatsJSReplicas | quote }}
  INGEST_NATS_JS_MAX_AGE: {{ .Values.runtime.env.ingestNatsJSMaxAge | quote }}
  GAP_REPAIR_NATS_JS_REPLICAS: {{ .Values.runtime.env.gapRepairNatsJSReplicas | quote }}
  PULSE_MQTT_EMULATOR_ENABLED: {{ .Values.runtime.env.pulseMqttEmulatorEnabled | quote }}
  PULSE_MQTT_EMULATOR_BASE_URL: {{ .Values.runtime.env.pulseMqttEmulatorBaseUrl | quote }}
  PULSE_MQTT_EMULATOR_BROKER_HOST: {{ .Values.runtime.env.pulseMqttEmulatorBrokerHost | quote }}
  PULSE_MQTT_EMULATOR_BROKER_PORT: {{ .Values.runtime.env.pulseMqttEmulatorBrokerPort | quote }}
  PULSE_MQTT_EMULATOR_TLS_SERVER_NAME: {{ .Values.runtime.env.pulseMqttEmulatorTLSServerName | quote }}
  PULSE_MQTT_EMULATOR_HTTP_ADDR: {{ .Values.runtime.env.pulseMqttEmulatorHTTPAddr | quote }}
  PULSE_MQTT_EMULATOR_MQTT_ADDR: {{ .Values.runtime.env.pulseMqttEmulatorMQTTAddr | quote }}
  PULSE_MQTT_EMULATOR_PUBLISH_INTERVAL: {{ .Values.runtime.env.pulseMqttEmulatorPublishInterval | quote }}
  PULSE_MQTT_EMULATOR_DEVICE_SN: {{ .Values.runtime.env.pulseMqttEmulatorDeviceSN | quote }}
  PULSE_MQTT_EMULATOR_DEVICE_NAME: {{ .Values.runtime.env.pulseMqttEmulatorDeviceName | quote }}
  PULSE_MQTT_EMULATOR_DEVICE_MODEL: {{ .Values.runtime.env.pulseMqttEmulatorDeviceModel | quote }}
  PULSE_MQTT_EMULATOR_BATTERY_PACK_COUNT: {{ .Values.runtime.env.pulseMqttEmulatorBatteryPackCount | quote }}
  PULSE_MQTT_EMULATOR_BATTERY_PACK_ENERGY_WH: {{ .Values.runtime.env.pulseMqttEmulatorBatteryPackEnergyWh | quote }}
  INGEST_METRICS_LISTEN_ADDR: {{ ternary (printf ":%v" .Values.runtime.workers.ingest.metrics.service.port) "" .Values.runtime.workers.ingest.metrics.enabled | quote }}
  INFERENCE_METRICS_LISTEN_ADDR: {{ ternary (printf ":%v" .Values.runtime.workers.inference.metrics.service.port) "" .Values.runtime.workers.inference.metrics.enabled | quote }}
  PROJECTION_METRICS_LISTEN_ADDR: {{ ternary (printf ":%v" .Values.runtime.workers.projection.metrics.service.port) "" .Values.runtime.workers.projection.metrics.enabled | quote }}
  ROLLUP_METRICS_LISTEN_ADDR: {{ ternary (printf ":%v" .Values.runtime.workers.rollup.metrics.service.port) "" .Values.runtime.workers.rollup.metrics.enabled | quote }}
  ARCHIVE_METRICS_LISTEN_ADDR: {{ ternary (printf ":%v" .Values.runtime.workers.archive.metrics.service.port) "" .Values.runtime.workers.archive.metrics.enabled | quote }}
  GRPC_METRICS_LISTEN_ADDR: {{ $grpcMetricsPort | quote }}
{{- if not .Values.runtime.secret.existingSecretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse-services.runtimeSecretName" . }}
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
type: Opaque
stringData:
  CONTROL_PLANE_DB_DSN: {{ .Values.runtime.env.controlPlaneDBDSN | quote }}
  ARCHIVE_MANIFEST_DB_DSN: {{ .Values.runtime.env.archiveManifestDBDSN | quote }}
  ARCHIVE_OBJECT_ACCESS_KEY: {{ .Values.runtime.env.archiveObjectAccessKey | quote }}
  ARCHIVE_OBJECT_SECRET_KEY: {{ .Values.runtime.env.archiveObjectSecretKey | quote }}
  VALKEY_CACHE_ENCRYPTION_KEYS: {{ .Values.runtime.env.valkeyCacheEncryptionKeys | quote }}
  PULSE_MQTT_EMULATOR_ACCESS_KEY: {{ .Values.runtime.env.pulseMqttEmulatorAccessKey | quote }}
  PULSE_MQTT_EMULATOR_SECRET_KEY: {{ .Values.runtime.env.pulseMqttEmulatorSecretKey | quote }}
  PULSE_MQTT_EMULATOR_MQTT_USERNAME: {{ .Values.runtime.env.pulseMqttEmulatorMQTTUsername | quote }}
  PULSE_MQTT_EMULATOR_MQTT_PASSWORD: {{ .Values.runtime.env.pulseMqttEmulatorMQTTPassword | quote }}
{{- end }}
{{- end }}
