{{- if .Values.runtime.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pulse-services.serviceAccountName" . }}
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
  {{- with .Values.runtime.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.runtime.serviceAccount.automountServiceAccountToken }}
{{- end }}
