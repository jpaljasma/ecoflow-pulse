{{- if .Values.runtime.workers.ingest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse-services.fullname" . }}-go-ingest
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-ingest
spec:
  replicas: {{ .Values.runtime.workers.ingest.replicaCount }}
  minReadySeconds: {{ .Values.runtime.workers.ingest.deployment.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.runtime.workers.ingest.deployment.strategy.maxUnavailable }}
      maxSurge: {{ .Values.runtime.workers.ingest.deployment.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "pulse-services.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: go-ingest
  template:
    metadata:
      annotations:
        checksum/runtime-env: {{ toJson .Values.runtime.env | sha256sum }}
        checksum/runtime-secret: {{ printf "%s|%s|%s|%s" .Values.runtime.env.controlPlaneDBDSN .Values.runtime.env.archiveManifestDBDSN .Values.runtime.env.archiveObjectAccessKey .Values.runtime.env.archiveObjectSecretKey | sha256sum }}
      labels:
        {{- include "pulse-services.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: go-ingest
    spec:
      terminationGracePeriodSeconds: {{ .Values.runtime.workers.ingest.deployment.terminationGracePeriodSeconds }}
      containers:
        - name: go-ingest
          image: "{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          command: ["/app/ecoflow-ingest-worker"]
          {{- if .Values.runtime.workers.ingest.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.runtime.workers.ingest.metrics.service.port }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "pulse-services.fullname" . }}-runtime-env
            - secretRef:
                name: {{ include "pulse-services.fullname" . }}-runtime-secret
          resources:
            {{- toYaml .Values.runtime.workers.ingest.resources | nindent 12 }}
          {{- if .Values.runtime.workers.ingest.metrics.enabled }}
          {{- if .Values.runtime.workers.ingest.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: {{ .Values.runtime.workers.ingest.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runtime.workers.ingest.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.runtime.workers.ingest.startupProbe.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
---
{{- if .Values.runtime.workers.ingest.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse-services.fullname" . }}-go-ingest-metrics
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-ingest
spec:
  selector:
    {{- include "pulse-services.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: go-ingest
  ports:
    - name: metrics
      port: {{ .Values.runtime.workers.ingest.metrics.service.port }}
      targetPort: metrics
{{- end }}
---
{{- if and .Values.runtime.workers.ingest.metrics.enabled .Values.runtime.workers.ingest.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pulse-services.fullname" . }}-go-ingest
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-ingest
    release: {{ .Values.global.platformReleaseName }}
spec:
  selector:
    matchLabels:
      {{- include "pulse-services.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: go-ingest
  namespaceSelector:
    matchNames:
      - {{ .Values.global.namespaces.services }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.runtime.workers.ingest.metrics.serviceMonitor.interval }}
{{- end }}
{{- if and .Values.runtime.workers.ingest.pdb.enabled (gt (int .Values.runtime.workers.ingest.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pulse-services.fullname" . }}-go-ingest
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-ingest
spec:
  minAvailable: {{ .Values.runtime.workers.ingest.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pulse-services.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: go-ingest
{{- end }}
{{- end }}
---
