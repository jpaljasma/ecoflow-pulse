  minReadySeconds: {{ .Values.runtime.workers.grpcApi.deployment.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.runtime.workers.grpcApi.deployment.strategy.maxUnavailable }}
      maxSurge: {{ .Values.runtime.workers.grpcApi.deployment.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "pulse-services.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: go-grpc-api
  template:
    metadata:
      annotations:
        checksum/runtime-env: {{ toJson .Values.runtime.env | sha256sum }}
        checksum/runtime-secret: {{ printf "%s|%s|%s|%s" .Values.runtime.env.controlPlaneDBDSN .Values.runtime.env.archiveManifestDBDSN .Values.runtime.env.archiveObjectAccessKey .Values.runtime.env.archiveObjectSecretKey | sha256sum }}
      labels:
        {{- include "pulse-services.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: go-grpc-api
    spec:
      terminationGracePeriodSeconds: {{ .Values.runtime.workers.grpcApi.deployment.terminationGracePeriodSeconds }}
      containers:
        - name: go-grpc-api
          image: "{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          command: ["/app/ecoflow-grpc-api"]
          ports:
            - name: grpc
              containerPort: {{ .Values.runtime.workers.grpcApi.service.port }}
            {{- if .Values.runtime.workers.grpcApi.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.runtime.workers.grpcApi.metrics.service.port }}
            {{- end }}
          env:
            - name: GRPC_LISTEN_ADDR
              value: {{ printf ":%v" .Values.runtime.workers.grpcApi.service.port | quote }}
            - name: GRPC_SERVICE_MODE
              value: "telemetry"
            - name: SOLAR_FORECAST_VERIFICATION_INTERVAL
              value: {{ .Values.runtime.workers.grpcApi.solarForecastVerificationInterval | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "pulse-services.fullname" . }}-runtime-env
            - secretRef:
                name: {{ include "pulse-services.fullname" . }}-runtime-secret
          resources:
            {{- toYaml .Values.runtime.workers.grpcApi.resources | nindent 12 }}
          {{- if .Values.runtime.workers.grpcApi.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: {{ .Values.runtime.workers.grpcApi.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.runtime.workers.grpcApi.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.runtime.workers.grpcApi.startupProbe.failureThreshold }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse-services.fullname" . }}-go-grpc-api
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-grpc-api
spec:
  selector:
    {{- include "pulse-services.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: go-grpc-api
  ports:
    - name: grpc
      port: {{ .Values.runtime.workers.grpcApi.service.port }}
      targetPort: grpc
{{- if .Values.runtime.workers.grpcApi.metrics.enabled }}
    - name: metrics
      port: {{ .Values.runtime.workers.grpcApi.metrics.service.port }}
      targetPort: metrics
{{- end }}
{{- if .Values.runtime.workers.grpcApi.metrics.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pulse-services.fullname" . }}-go-grpc-api
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-grpc-api
    release: {{ .Values.global.platformReleaseName }}
spec:
  selector:
    matchLabels:
      {{- include "pulse-services.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: go-grpc-api
  namespaceSelector:
    matchNames:
      - {{ .Values.global.namespaces.services }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.runtime.workers.grpcApi.metrics.serviceMonitor.interval }}
{{- end }}
{{- if and .Values.runtime.workers.grpcApi.pdb.enabled (gt (int .Values.runtime.workers.grpcApi.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pulse-services.fullname" . }}-go-grpc-api
  labels:
    {{- include "pulse-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-grpc-api
spec:
  minAvailable: {{ .Values.runtime.workers.grpcApi.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pulse-services.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: go-grpc-api
{{- end }}
{{- end }}
