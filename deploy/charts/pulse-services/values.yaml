global:
  environment: local
  platformReleaseName: pulse-platform
  namespaces:
    platform: pulse-platform
    services: pulse-services

scaffold:
  enabled: true
  message: "pulse-services scaffold chart"

runtime:
  image:
    repository: ecoflow-pulse/services
    tag: local
    pullPolicy: IfNotPresent
  serviceAccount:
    create: false
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  secret:
    existingSecretName: ""
  secretManager:
    enabled: false
    secretStore:
      create: false
      kind: SecretStore
      name: pulse-services-gcp-secrets
      projectId: ""
      clusterLocation: ""
      clusterName: ""
    runtimeExternalSecret:
      enabled: false
      refreshInterval: 1h
      targetSecretName: ""
      data:
        controlPlaneDBDSN: ""
        archiveManifestDBDSN: ""
        archiveObjectAccessKey: ""
        archiveObjectSecretKey: ""
        valkeyCacheEncryptionKeys: ""
        pulseMqttEmulatorAccessKey: ""
        pulseMqttEmulatorSecretKey: ""
        pulseMqttEmulatorMQTTUsername: ""
        pulseMqttEmulatorMQTTPassword: ""
  migrations:
    enabled: false
    namespace: pulse-platform
    serviceAccountName: ""
    db:
      host: pulse-platform-core-rw
      port: 5432
      name: pulse
      sslmode: disable
      credentialsSecretName: pulse-platform-core-app
      usernameKey: username
      passwordKey: password
    policy:
      rolloutEnv: dev
      requireBackup: false
      backupRef: ""
      forwardOnly: true
    job:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 600
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  env:
    controlPlaneDBDSN: ""
    archiveManifestDBDSN: ""
    ecoflowEnv: "dev"
    ecoflowBaseUrl: "https://api.ecoflow.com"
    dbSchemaSearchPath: ""
    natsURLs: "nats://pulse-platform-nats.pulse-platform.svc.cluster.local:4222"
    valkeyAddrs: "pulse-platform-valkey-node-0.pulse-platform-valkey-headless.pulse-platform.svc.cluster.local:6379"
    valkeySentinelMasterSet: ""
    valkeyCacheClientSideCacheEnabled: "true"
    valkeyCacheSizeEachConn: ""
    valkeyCacheClientTrackingOptions: "OPTIN"
    valkeyCacheEncryptionKeyID: ""
    valkeyCacheEncryptionKeys: ""
    providerMqttSessionCacheKeyPrefix: "pulse:provider-mqtt-session"
    providerMqttSessionCacheIdleTTL: "30m"
    providerMqttSessionCacheMaxAge: "6h"
    providerMqttSessionCacheLocalTTL: "5s"
    energyCacheKeyPrefix: "pulse:energy"
    energyCalendarCacheLocalTTL: "5s"
    energyPvPortHistoryCacheLocalTTL: "5s"
    inferenceEnergyComparisonCacheLocalTTL: "30s"
    inferenceContextCacheLocalTTL: "10s"
    grpcAuthMode: "noop"
    keycloakIssuerUrl: ""
    keycloakAudience: ""
    keycloakJwksUrl: ""
    grpcAuthAllowMissingJwt: "false"
    archiveObjectProvider: "minio"
    archiveObjectEndpoint: "pulse-platform-minio.pulse-platform.svc.cluster.local:9000"
    archiveObjectAccessKey: "minio"
    archiveObjectSecretKey: "minio123"
    archiveObjectBucket: "pulse-telemetry-raw"
    archiveObjectPrefix: "raw"
    archiveObjectRegion: "us-east-1"
    archiveObjectGCSProjectID: ""
    archiveObjectSecure: "false"
    archiveObjectAutoCreateBucket: "true"
    ingestNatsJSReplicas: "3"
    ingestNatsJSMaxAge: "12h"
    gapRepairNatsJSReplicas: "3"
    pulseMqttEmulatorEnabled: "true"
    pulseMqttEmulatorBaseUrl: "http://pulse-services-pulse-mqtt-emulator.pulse-services.svc.cluster.local:8080"
    pulseMqttEmulatorBrokerHost: "pulse-services-pulse-mqtt-emulator.pulse-services.svc.cluster.local"
    pulseMqttEmulatorBrokerPort: "8883"
    pulseMqttEmulatorTLSServerName: "pulse-services-pulse-mqtt-emulator.pulse-services.svc.cluster.local"
    pulseMqttEmulatorHTTPAddr: ":8080"
    pulseMqttEmulatorMQTTAddr: ":8883"
    pulseMqttEmulatorPublishInterval: "5s"
    pulseMqttEmulatorDeviceSN: "PULSEDPUX24K001"
    pulseMqttEmulatorDeviceName: "DPU-X 24 kWh"
    pulseMqttEmulatorDeviceModel: "DELTA Pro Ultra X"
    pulseMqttEmulatorBatteryPackCount: "4"
    pulseMqttEmulatorBatteryPackEnergyWh: "6144"
    pulseMqttEmulatorAccessKey: "pulse-mqtt-local-ak"
    pulseMqttEmulatorSecretKey: "pulse-mqtt-local-sk"
    pulseMqttEmulatorMQTTUsername: "open-pulse-local-account"
    pulseMqttEmulatorMQTTPassword: "pulse-mqtt-local-password"
  workers:
    defaultPodScheduling:
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
    ingest:
      enabled: false
      replicaCount: 1
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      deployment:
        minReadySeconds: 10
        terminationGracePeriodSeconds: 45
        strategy:
          maxUnavailable: 0
          maxSurge: 1
      pdb:
        enabled: true
        minAvailable: 1
      startupProbe:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 24
      metrics:
        enabled: false
        service:
          port: 9095
        serviceMonitor:
          enabled: false
          interval: 30s
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
