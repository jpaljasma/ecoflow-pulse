global:
  environment: local
  platformReleaseName: pulse-platform
  namespaces:
    platform: pulse-platform
    services: pulse-services

scaffold:
  enabled: true
  message: "pulse-services scaffold chart"

runtime:
  image:
    repository: ecoflow-pulse/services
    tag: local
    pullPolicy: IfNotPresent
  migrations:
    enabled: false
    namespace: pulse-platform
    db:
      host: pulse-platform-core-rw
      port: 5432
      name: pulse
      sslmode: disable
      credentialsSecretName: pulse-platform-core-app
      usernameKey: username
      passwordKey: password
    policy:
      rolloutEnv: dev
      requireBackup: false
      backupRef: ""
      forwardOnly: true
    job:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 600
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  env:
    controlPlaneDBDSN: ""
    archiveManifestDBDSN: ""
    ecoflowEnv: "dev"
    ecoflowBaseUrl: "https://api.ecoflow.com"
    dbSchemaSearchPath: ""
    natsURLs: "nats://pulse-platform-nats.pulse-platform.svc.cluster.local:4222"
    valkeyAddrs: "pulse-platform-valkey-node-0.pulse-platform-valkey-headless.pulse-platform.svc.cluster.local:6379"
    valkeySentinelMasterSet: ""
    grpcAuthMode: "noop"
    keycloakIssuerUrl: ""
    keycloakAudience: ""
    keycloakJwksUrl: ""
    grpcAuthAllowMissingJwt: "false"
    archiveObjectEndpoint: "pulse-platform-minio.pulse-platform.svc.cluster.local:9000"
    archiveObjectAccessKey: "minio"
    archiveObjectSecretKey: "minio123"
    archiveObjectBucket: "pulse-telemetry-raw"
    archiveObjectPrefix: "raw"
    archiveObjectRegion: "us-east-1"
    archiveObjectSecure: "false"
    archiveObjectAutoCreateBucket: "true"
  workers:
    ingest:
      enabled: false
      replicaCount: 1
      deployment:
        minReadySeconds: 10
        terminationGracePeriodSeconds: 45
        strategy:
          maxUnavailable: 0
          maxSurge: 1
      pdb:
        enabled: true
        minAvailable: 1
      startupProbe:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 24
      metrics:
        enabled: false
        service:
          port: 9095
        serviceMonitor:
          enabled: false
          interval: 30s
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
    inference:
      enabled: false
      replicaCount: 1
      deployment:
        minReadySeconds: 10
        terminationGracePeriodSeconds: 45
        strategy:
          maxUnavailable: 0
          maxSurge: 1
      pdb:
        enabled: true
        minAvailable: 1
      startupProbe:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 24
      metrics:
        enabled: false
        service:
          port: 9095
        serviceMonitor:
          enabled: false
          interval: 30s
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
    projection:
      enabled: false
      replicaCount: 1
      deployment:
        minReadySeconds: 10
        terminationGracePeriodSeconds: 45
        strategy:
          maxUnavailable: 0
