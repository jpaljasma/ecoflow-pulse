apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulse-platform-cloud
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ecoflow-pulse
spec:
  project: default
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: pulse-platform-cloud-nats
      namespace: pulse-platform
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/containers/0/env/0/valueFrom/fieldRef/apiVersion
        - /spec/template/spec/containers/0/imagePullPolicy
        - /spec/template/spec/containers/0/livenessProbe/httpGet/scheme
        - /spec/template/spec/containers/0/ports/0/protocol
        - /spec/template/spec/containers/0/ports/1/protocol
        - /spec/template/spec/containers/0/readinessProbe/httpGet/scheme
        - /spec/template/spec/containers/0/startupProbe/httpGet/scheme
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/containers/1/imagePullPolicy
        - /spec/template/spec/containers/1/resources
        - /spec/template/spec/containers/1/terminationMessagePath
        - /spec/template/spec/containers/1/terminationMessagePolicy
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/securityContext
        - /spec/template/spec/volumes/0/configMap/defaultMode
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/spec/resources
        - /spec/volumeClaimTemplates/0/spec/storageClassName
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
    - group: apps
      kind: StatefulSet
      name: pulse-platform-cloud-valkey-node
      namespace: pulse-platform
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/revisionHistoryLimit
        - /spec/template/spec/containers/0/imagePullPolicy
        - /spec/template/spec/containers/0/livenessProbe/tcpSocket/port
        - /spec/template/spec/containers/0/readinessProbe/tcpSocket/port
        - /spec/template/spec/containers/0/startupProbe/tcpSocket/port
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/template/spec/containers/1/imagePullPolicy
        - /spec/template/spec/containers/1/readinessProbe/tcpSocket/port
        - /spec/template/spec/containers/1/startupProbe/tcpSocket/port
        - /spec/template/spec/containers/1/terminationMessagePath
        - /spec/template/spec/containers/1/terminationMessagePolicy
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/securityContext
        - /spec/updateStrategy
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/spec/resources
        - /spec/volumeClaimTemplates/0/spec/storageClassName
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
  source:
    repoURL: https://github.com/jpaljasma/ecoflow-pulse.git
    targetRevision: main
    path: deploy/charts/pulse-platform
    helm:
      valueFiles:
        - ../../env/cloud/values.platform.yaml
        - ../../env/cloud/values.platform.cost-min.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pulse-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
