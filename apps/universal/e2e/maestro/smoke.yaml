appId: __MAESTRO_APP_ID__
---
- launchApp
- extendedWaitUntil:
    visible: "EcoFlow Pulse"
    timeout: 120000
- tapOn: "EcoFlow Pulse"
- extendedWaitUntil:
    visible: "Pulse"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "device-card-019cab9d-bcb3-7587-8dc9-9a57deb48d30"
    timeout: 30000
- tapOn:
    id: "device-card-019cab9d-bcb3-7587-8dc9-9a57deb48d30"
- extendedWaitUntil:
    visible: "DELTA Pro Ultra"
    timeout: 30000
- assertNotVisible: "Device detail failed to load"
- tapOn:
    id: "close-to-devices"
- extendedWaitUntil:
    visible:
      id: "tab-settings"
    timeout: 30000
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible: "API Endpoints"
    timeout: 30000
- tapOn:
    id: "tab-search"
- extendedWaitUntil:
    visible: "Search devices and telemetry"
    timeout: 30000
- tapOn:
    id: "tab-about"
- extendedWaitUntil:
    visible: "About EcoFlow Pulse"
    timeout: 30000
