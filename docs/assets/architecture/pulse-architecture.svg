    <path class="edge-soft" d="M1195 487 C1040 676 612 790 415 970"/>
    <path class="edge-soft" d="M1195 487 C1080 594 866 700 705 758"/>
    <path class="edge-soft" d="M790 1144 C730 1144 610 1144 550 1144"/>
    <path class="edge-soft" d="M790 487 C958 732 1130 940 1195 1116"/>
