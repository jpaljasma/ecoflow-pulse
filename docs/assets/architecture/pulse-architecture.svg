    <path class="edge-soft" d="M695 822 C792 938 1030 1050 1195 1116"/>
  </g>

  <use href="#nodes"/>

  <g id="edge-labels">
    <rect class="label-bg" x="678" y="280" width="86" height="24"/>
    <text class="edge-label" x="690" y="297">PKCE</text>

    <rect class="label-bg" x="444" y="366" width="96" height="24"/>
    <text class="edge-label" x="456" y="383">REST + WS</text>

    <rect class="label-bg" x="826" y="390" width="54" height="24"/>
    <text class="edge-label" x="838" y="407">JWT</text>

    <rect class="label-bg" x="588" y="522" width="112" height="24"/>
    <text class="edge-label" x="600" y="539">gRPC + JWT</text>

    <rect class="label-bg" x="410" y="690" width="142" height="24"/>
    <text class="edge-label" x="422" y="707">provider telemetry</text>

    <rect class="label-bg" x="526" y="735" width="76" height="24"/>
    <text class="edge-label" x="538" y="752">envelope</text>

    <rect class="label-bg" x="455" y="916" width="86" height="24"/>
