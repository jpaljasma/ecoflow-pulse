name: Cloud Services Deploy

on:
  workflow_run:
    workflows:
      - Go Tests
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional services image tag override
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: cloud-services-deploy-main
  cancel-in-progress: false

env:
  CLOUD_ARTIFACT_REGISTRY_HOST: us-east1-docker.pkg.dev
  GKE_CLOUD_CLUSTER_NAME: pulse-cloud
  GKE_CLOUD_CLUSTER_REGION: us-east1
  GKE_CLOUD_PROJECT_ID: ecoflow-pulse-dev-260221-01
  SERVICES_CLOUD_IMAGE_REPO: us-east1-docker.pkg.dev/ecoflow-pulse-dev-260221-01/ecoflow-pulse/services

jobs:
  deploy:
    name: cloud-services-deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            head_sha="${{ github.event.workflow_run.head_sha }}"
          else
            head_sha="${GITHUB_SHA}"
          fi

          requested_tag="${{ inputs.image_tag }}"
          if [[ -n "${requested_tag}" ]]; then
            tag="${requested_tag}"
          else
            tag="cloud-services-${head_sha:0:12}"
          fi

          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Wait for required main checks
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.image.outputs.head_sha }}
          REQUIRED_WORKFLOWS: |
            Go Tests
            Frontend CI
            DB Migrations CI
            Proto CI
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 3600))
          while true; do
            all_ready=1
            while IFS= read -r workflow; do
              [[ -n "${workflow}" ]] || continue
              run_json="$(
                gh run list \
                  --workflow "${workflow}" \
                  --branch main \
                  --event push \
                  --limit 20 \
                  --json conclusion,databaseId,headSha,status,url
              )"
              row="$(
                jq -er --arg sha "${HEAD_SHA}" \
                  'map(select(.headSha == $sha)) | first // empty' \
                  <<<"${run_json}" 2>/dev/null || true
              )"
              if [[ -z "${row}" ]]; then
                echo "${workflow}: waiting for run on ${HEAD_SHA}"
                all_ready=0
                continue
              fi

              status="$(jq -r '.status' <<<"${row}")"
              conclusion="$(jq -r '.conclusion // ""' <<<"${row}")"
              url="$(jq -r '.url' <<<"${row}")"
              echo "${workflow}: status=${status} conclusion=${conclusion:-pending} url=${url}"

              if [[ "${status}" != "completed" ]]; then
                all_ready=0
                continue
              fi
              if [[ "${conclusion}" != "success" ]]; then
                echo "::error::${workflow} did not succeed for ${HEAD_SHA}: ${url}"
                exit 1
              fi
            done <<<"${REQUIRED_WORKFLOWS}"

            if [[ "${all_ready}" == "1" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::timed out waiting for required main checks for ${HEAD_SHA}"
              exit 1
            fi
            sleep 30
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Configure Artifact Registry Docker auth
        run: gcloud auth configure-docker "${CLOUD_ARTIFACT_REGISTRY_HOST}" --quiet

      - name: Build and push services image
        run: >-
          make
          services-image-push-cloud
          SERVICES_CLOUD_IMAGE_TAG="${{ steps.image.outputs.tag }}"

      - name: Fetch cloud cluster credentials
        run: make gke-cloud-context

      - name: Direct Helm cloud services deploy
        env:
          CLOUD_SERVICES_HELM_SET_ARGS: >-
            --set runtime.image.repository=${{ env.SERVICES_CLOUD_IMAGE_REPO }}
            --set runtime.image.tag=${{ steps.image.outputs.tag }}
        run: >-
          make cloud-services-apply
          CLOUD_SERVICES_VALUES="deploy/env/cloud/values.services.yaml deploy/env/cloud/values.services.cost-min.yaml"
