name: Go Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: go-test-inputs
    runs-on: ubuntu-latest
    outputs:
      go_changed: ${{ steps.filter.outputs.go_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Go-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${base_sha}" "${GITHUB_SHA}" > changed_files.txt

          if grep -Eq '(^|/).*\.go$|^go\.mod$|^go\.sum$|^Makefile$|^buf\.yaml$|^buf\.gen\.yaml$|^proto/|^gen/|^\.github/workflows/go-tests\.yml$' changed_files.txt; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_changed=false" >> "$GITHUB_OUTPUT"
          fi

  go-test:
    name: go-test
    runs-on: ubuntu-latest
    needs:
      - changes
    steps:
      - name: Skip when Go inputs are unchanged
        if: needs.changes.outputs.go_changed != 'true'
        run: echo "No Go-relevant changes detected; skipping go test ./..."

      - name: Checkout
        if: needs.changes.outputs.go_changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Go
        if: needs.changes.outputs.go_changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run all Go tests
        if: needs.changes.outputs.go_changed == 'true'
        run: go test ./...

  go-test-race-critical:
    name: go-test-race-critical
    runs-on: ubuntu-latest
    needs:
      - changes
    steps:
      - name: Skip when Go inputs are unchanged
        if: needs.changes.outputs.go_changed != 'true'
        run: echo "No Go-relevant changes detected; skipping critical race tests"

      - name: Checkout
        if: needs.changes.outputs.go_changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Go
        if: needs.changes.outputs.go_changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go race tests (critical paths)
        if: needs.changes.outputs.go_changed == 'true'
        run: go test -race ./internal/ingestworker ./internal/ingestlease ./internal/projectionworker ./internal/archiveworker ./internal/telemetrybus ./cmd/ecoflow-grpc-api
