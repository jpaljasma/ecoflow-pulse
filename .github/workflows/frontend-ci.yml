name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI should validate app build/tooling, not local mock-log ingestion paths.
  EXPO_PUBLIC_API_URL: http://127.0.0.1:8080
  EXPO_PUBLIC_WS_URL: ws://127.0.0.1:8080/ws
  EXPO_NO_TELEMETRY: "1"

jobs:
  changes:
    name: frontend-ci-inputs
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${base_sha}" "${GITHUB_SHA}" > changed_files.txt

          if grep -Eq '(^apps/universal/|^apps/pulse-platform/|^apps/pulse-realtime-gateway/|^packages/|^package\.json$|^package-lock\.json$|^\.github/workflows/frontend-ci\.yml$)' changed_files.txt; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-server-ci:
    name: frontend-server-ci
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.frontend_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Go (for Node↔Go proto contract tests)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Prepare mock log placeholders (CI)
        run: |
          mkdir -p logs
          : > logs/telemetry_training.csv
          : > logs/mqtt.log

      - name: Typecheck auth middleware package
        run: npm run typecheck --workspace @ecoflow-pulse/node-jwks-auth

      - name: Test auth middleware package
        run: npm run test --workspace @ecoflow-pulse/node-jwks-auth

      - name: Build auth middleware package
        run: npm run build --workspace @ecoflow-pulse/node-jwks-auth

      - name: Typecheck pulse-platform BFF
        run: npm run typecheck --workspace @ecoflow-pulse/pulse-platform

      - name: Lint pulse-platform BFF
        run: npm run lint --workspace @ecoflow-pulse/pulse-platform

      - name: Test pulse-platform BFF
        run: npm run test --workspace @ecoflow-pulse/pulse-platform

      - name: Typecheck pulse-realtime-gateway
        run: npm run typecheck --workspace @ecoflow-pulse/pulse-realtime-gateway

      - name: Lint pulse-realtime-gateway
        run: npm run lint --workspace @ecoflow-pulse/pulse-realtime-gateway

      - name: Test pulse-realtime-gateway
        run: npm run test --workspace @ecoflow-pulse/pulse-realtime-gateway

  frontend-universal-ci:
    name: frontend-universal-ci
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.frontend_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache Expo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.expo
            apps/universal/.expo
          key: expo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/universal/package.json', 'apps/universal/playwright.config.ts') }}
          restore-keys: |
            expo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Typecheck universal app
        run: npm run -w apps/universal typecheck

      - name: Lint universal app
        run: npm run -w apps/universal lint

      - name: Test universal app
        run: npm run -w apps/universal test

      - name: Expo web export (sanity)
        run: npm run export:web:ci
        working-directory: apps/universal

  frontend-web-e2e:
    name: frontend-web-e2e
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.frontend_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache Expo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.expo
            apps/universal/.expo
          key: expo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/universal/package.json', 'apps/universal/playwright.config.ts') }}
          restore-keys: |
            expo-${{ runner.os }}-

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/universal

      - name: Web E2E (Playwright)
        run: npm run -w apps/universal e2e:web

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - changes
      - frontend-server-ci
      - frontend-universal-ci
      - frontend-web-e2e
    steps:
      - name: Verify frontend shard results
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "frontend-server-ci=${{ needs.frontend-server-ci.result }}"
          echo "frontend-universal-ci=${{ needs.frontend-universal-ci.result }}"
          echo "frontend-web-e2e=${{ needs.frontend-web-e2e.result }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.frontend-server-ci.result }}" != "success" && "${{ needs.frontend-server-ci.result }}" != "skipped" ]]; then
            exit 1
          fi
          if [[ "${{ needs.frontend-universal-ci.result }}" != "success" && "${{ needs.frontend-universal-ci.result }}" != "skipped" ]]; then
            exit 1
          fi
          if [[ "${{ needs.frontend-web-e2e.result }}" != "success" && "${{ needs.frontend-web-e2e.result }}" != "skipped" ]]; then
            exit 1
          fi
