name: Pi Appliance Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional GHCR image tag override
        required: false
        type: string
      image_pull_secret:
        description: Optional Kubernetes pull secret name to render into the release artifact
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: pi-appliance-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: pi-appliance-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          requested_tag="${REQUESTED_IMAGE_TAG}"
          if [[ -n "${requested_tag}" ]]; then
            tag="${requested_tag}"
          else
            tag="pi-${GITHUB_SHA:0:12}"
          fi

          {
            echo "owner=${owner}"
            echo "tag=${tag}"
            echo "services_image=ghcr.io/${owner}/services"
            echo "platform_image=ghcr.io/${owner}/pulse-platform"
            echo "realtime_image=ghcr.io/${owner}/pulse-realtime-gateway"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push services image
        id: build_services
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/pulse-services.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.services_image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push public app image
        id: build_platform
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/pulse-platform.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.platform_image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            EXPO_PUBLIC_API_URL=https://pulse.home.arpa/api
            EXPO_PUBLIC_WS_URL=wss://pulse.home.arpa/ws
            EXPO_PUBLIC_OIDC_ISSUER_URL=https://pulse.home.arpa/realms/pulse
            EXPO_PUBLIC_OIDC_CLIENT_ID=pulse-universal-app
            EXPO_PUBLIC_OIDC_AUDIENCE=pulse-universal-app
            EXPO_PUBLIC_OIDC_SCOPES=openid profile email offline_access
            EXPO_PUBLIC_DEFAULT_CONNECTION_PROFILE=local
            EXPO_PUBLIC_LOCAL_DATA_PLANE=local

      - name: Build and push realtime gateway image
        id: build_realtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/pulse-realtime-gateway.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.realtime_image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Render release values artifact
        env:
          PULSE_PI_IMAGE_NAMESPACE: ${{ steps.meta.outputs.owner }}
          PULSE_PI_IMAGE_PULL_SECRET: ${{ inputs.image_pull_secret }}
          PULSE_PI_PUBLIC_APP_IMAGE_DIGEST: ${{ steps.build_platform.outputs.digest }}
          PULSE_PI_REALTIME_GATEWAY_IMAGE_DIGEST: ${{ steps.build_realtime.outputs.digest }}
          PULSE_PI_SERVICES_IMAGE_DIGEST: ${{ steps.build_services.outputs.digest }}
        run: |
          bash deploy/appliance/pi5/pulse-appliance-render-release-values.sh \
            --output pulse-pi-release.yaml

      - name: Upload release values artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-pi-release-values
          path: pulse-pi-release.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Summarize images
        shell: bash
        env:
          SERVICES_IMAGE: ${{ steps.meta.outputs.services_image }}
          SERVICES_DIGEST: ${{ steps.build_services.outputs.digest }}
          PLATFORM_IMAGE: ${{ steps.meta.outputs.platform_image }}
          PLATFORM_DIGEST: ${{ steps.build_platform.outputs.digest }}
          REALTIME_IMAGE: ${{ steps.meta.outputs.realtime_image }}
          REALTIME_DIGEST: ${{ steps.build_realtime.outputs.digest }}
        run: |
          {
            echo "### Pi appliance images"
            echo
            echo "- Services: \`${SERVICES_IMAGE}@${SERVICES_DIGEST}\`"
            echo "- Public app: \`${PLATFORM_IMAGE}@${PLATFORM_DIGEST}\`"
            echo "- Realtime gateway: \`${REALTIME_IMAGE}@${REALTIME_DIGEST}\`"
            echo
            echo "Download the \`pulse-pi-release-values\` artifact and install it as the appliance release values file."
          } >> "$GITHUB_STEP_SUMMARY"
