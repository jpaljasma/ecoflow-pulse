name: Proto CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/proto-ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/proto-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-ci:
    name: proto-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Buf lint
        run: buf lint
