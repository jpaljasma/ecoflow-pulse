name: Proto CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: proto-ci-inputs
    runs-on: ubuntu-latest
    outputs:
      proto_changed: ${{ steps.filter.outputs.proto_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect proto-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "proto_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            echo "proto_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${base_sha}" "${GITHUB_SHA}" > changed_files.txt

          if grep -Eq '(^proto/|^buf\.yaml$|^buf\.gen\.yaml$|^\.github/workflows/proto-ci\.yml$)' changed_files.txt; then
            echo "proto_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proto_changed=false" >> "$GITHUB_OUTPUT"
          fi

  proto-ci-run:
    name: proto-ci-run
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.proto_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Buf lint
        run: buf lint

  proto-ci:
    name: proto-ci
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - changes
      - proto-ci-run
    steps:
      - name: Verify proto CI result
        shell: bash
        run: |
          set -euo pipefail

          echo "changes=${{ needs.changes.result }}"
          echo "proto-ci-run=${{ needs.proto-ci-run.result }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.proto-ci-run.result }}" != "success" && "${{ needs.proto-ci-run.result }}" != "skipped" ]]; then
            exit 1
          fi
