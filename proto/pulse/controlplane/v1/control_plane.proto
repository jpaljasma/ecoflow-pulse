syntax = "proto3";

package pulse.controlplane.v1;

option go_package = "github.com/jpaljasma/ecoflow-pulse/gen/pulse/controlplane/v1;controlplanev1";

import "google/protobuf/struct.proto";

message ProviderCredential {
  string id = 1;
  string provider = 2;
  string access_key_mask = 3;
  bool is_active = 4;
  int64 created_at_unix_ms = 5;
  int64 updated_at_unix_ms = 6;
  google.protobuf.Struct config = 7;
}

message CreateProviderCredentialRequest {
  string user_subject = 1;
  string provider = 2;
  string access_key = 3;
  string secret_key = 4;
  bool is_active = 5;
  google.protobuf.Struct config = 6;
}

message CreateProviderCredentialResponse {
  ProviderCredential credential = 1;
}

message ListProviderCredentialsRequest {
  string user_subject = 1;
  string provider = 2;
}

message ListProviderCredentialsResponse {
  repeated ProviderCredential credentials = 1;
}

message SetProviderCredentialActiveRequest {
  string user_subject = 1;
  string credential_id = 2;
  bool is_active = 3;
}

message SetProviderCredentialActiveResponse {
  ProviderCredential credential = 1;
}

message UpdateProviderCredentialRequest {
  string user_subject = 1;
  string credential_id = 2;
  string access_key = 3;
  string secret_key = 4;
  bool is_active = 5;
  google.protobuf.Struct config = 6;
}

message UpdateProviderCredentialResponse {
  ProviderCredential credential = 1;
}

message ProviderDevice {
  string id = 1;
  string device_id = 2;
  string provider = 3;
  string provider_device_id = 4;
  string credential_id = 5;
  string canonical_sn = 6;
  string product_name = 7;
  string model = 8;
  bool is_active = 9;
  string ingest_desired_state = 10;
  google.protobuf.Struct capabilities = 11;
  google.protobuf.Struct metadata = 12;
}

message UserDevice {
  string device_id = 1;
  string ecoflow_sn = 2;
  string product_name = 3;
  string model = 4;
  string role = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
}

message CurrentUser {
  string id = 1;
  string keycloak_subject = 2;
  string email = 3;
  bool email_verified = 4;
  string display_name = 5;
  string display_name_source = 6;
  string avatar_url = 7;
  string given_name = 8;
  string family_name = 9;
  string locale = 10;
  string timezone = 11;
  bool weather_location_enabled = 12;
  string weather_location_source = 13;
  string weather_location_label = 14;
  double weather_latitude = 15;
  double weather_longitude = 16;
  bool has_weather_location = 17;
  int64 last_login_at_unix_ms = 18;
  int64 created_at_unix_ms = 19;
  int64 updated_at_unix_ms = 20;
  string auth_method = 21;
}

message AuthorizationSummary {
  repeated string token_roles = 1;
  uint32 device_count = 2;
}

message GetCurrentUserRequest {
  string user_subject = 1;
}

message GetCurrentUserResponse {
  CurrentUser user = 1;
  AuthorizationSummary authorization = 2;
}

message UpdateCurrentUserRequest {
  string user_subject = 1;
  string display_name = 2;
  string timezone = 3;
  bool weather_location_enabled = 4;
  string weather_location_source = 5;
  string weather_location_label = 6;
  double weather_latitude = 7;
  double weather_longitude = 8;
  bool has_weather_location = 9;
}

message UpdateCurrentUserResponse {
  CurrentUser user = 1;
}

message RefreshCurrentUserIdentityRequest {
  string user_subject = 1;
  string email = 2;
  bool email_verified = 3;
  string display_name = 4;
  string avatar_url = 5;
  string given_name = 6;
  string family_name = 7;
  string locale = 8;
}

message RefreshCurrentUserIdentityResponse {
  CurrentUser user = 1;
}

message CreateDeviceRequest {
  string user_subject = 1;
  string ecoflow_sn = 2;
  string product_name = 3;
  string model = 4;
}

message CreateDeviceResponse {
  UserDevice device = 1;
}

message LinkDeviceRequest {
  string user_subject = 1;
  string target_user_subject = 2;
  string device_id = 3;
  string role = 4;
}

message LinkDeviceResponse {
  UserDevice device = 1;
}

message ListUserDevicesRequest {
  string user_subject = 1;
}

message ListUserDevicesResponse {
  repeated UserDevice devices = 1;
}

message ProviderDeviceGroup {
  string provider = 1;
  repeated ProviderDevice devices = 2;
}

message ListDevicesRequest {
  string user_subject = 1;
  string provider = 2;
  bool active_only = 3;
}

message ListDevicesResponse {
  repeated ProviderDeviceGroup groups = 1;
}

message DiscoverDevicesRequest {
  string user_subject = 1;
  string provider = 2;
  string credential_id = 3;
}

message DiscoverDevicesResponse {
  bool accepted = 1;
  string status = 2;
  uint32 discovered_count = 3;
  repeated ProviderDevice devices = 4;
}

message AvailableProviderDevice {
  string provider = 1;
  string provider_device_id = 2;
  string credential_id = 3;
  string canonical_sn = 4;
  string product_name = 5;
  string model = 6;
  google.protobuf.Struct capabilities = 7;
  google.protobuf.Struct metadata = 8;
}

message ListAvailableProviderDevicesRequest {
  string user_subject = 1;
  string provider = 2;
}

message ListAvailableProviderDevicesResponse {
  repeated AvailableProviderDevice devices = 1;
  bool has_active_credentials = 2;
}

message TestProviderDeviceMQTTRequest {
  string user_subject = 1;
  string provider = 2;
  string credential_id = 3;
  string provider_device_id = 4;
}

message TestProviderDeviceMQTTResponse {
  bool success = 1;
  string status = 2;
  string sample_topic = 3;
  int64 payload_bytes = 4;
  int64 observed_at_unix_ms = 5;
}

message EnableProviderDeviceRequest {
  string user_subject = 1;
  string provider = 2;
  string credential_id = 3;
  string provider_device_id = 4;
}

message EnableProviderDeviceResponse {
  ProviderDevice provider_device = 1;
  UserDevice user_device = 2;
}

message ImportProviderDeviceRequest {
  string user_subject = 1;
  string provider = 2;
  string credential_id = 3;
  string provider_device_id = 4;
  bool is_active = 5;
  string ingest_desired_state = 6;
}

message ImportProviderDeviceResponse {
  ProviderDevice provider_device = 1;
  UserDevice user_device = 2;
}

service ControlPlaneService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc UpdateCurrentUser(UpdateCurrentUserRequest) returns (UpdateCurrentUserResponse);
  rpc RefreshCurrentUserIdentity(RefreshCurrentUserIdentityRequest) returns (RefreshCurrentUserIdentityResponse);
  rpc CreateProviderCredential(CreateProviderCredentialRequest) returns (CreateProviderCredentialResponse);
  rpc ListProviderCredentials(ListProviderCredentialsRequest) returns (ListProviderCredentialsResponse);
  rpc SetProviderCredentialActive(SetProviderCredentialActiveRequest) returns (SetProviderCredentialActiveResponse);
  rpc UpdateProviderCredential(UpdateProviderCredentialRequest) returns (UpdateProviderCredentialResponse);
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse);
  rpc LinkDevice(LinkDeviceRequest) returns (LinkDeviceResponse);
  rpc ListUserDevices(ListUserDevicesRequest) returns (ListUserDevicesResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc DiscoverDevices(DiscoverDevicesRequest) returns (DiscoverDevicesResponse);
  rpc ListAvailableProviderDevices(ListAvailableProviderDevicesRequest) returns (ListAvailableProviderDevicesResponse);
  rpc TestProviderDeviceMQTT(TestProviderDeviceMQTTRequest) returns (TestProviderDeviceMQTTResponse);
  rpc EnableProviderDevice(EnableProviderDeviceRequest) returns (EnableProviderDeviceResponse);
  rpc ImportProviderDevice(ImportProviderDeviceRequest) returns (ImportProviderDeviceResponse);
}
