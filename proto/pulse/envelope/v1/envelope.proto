syntax = "proto3";

package pulse.envelope.v1;

option go_package = "github.com/jpaljasma/ecoflow-pulse/gen/pulse/envelope/v1;envelopev1";

// TelemetryEnvelope is the canonical ingest/archive frame for replay.
// It is intentionally transport-agnostic and includes shard/version metadata.
message TelemetryEnvelope {
  // UUIDv7 generated by the ingest edge.
  string envelope_id = 1;

  // Envelope schema version for forward-compatible readers.
  uint32 envelope_version = 2;

  // Device identity.
  string device_id = 3;
  string ecoflow_sn = 4;

  // Deterministic shard assignment.
  uint32 shard = 5;
  uint32 shard_count = 6;

  // Optional upstream message identifier for idempotency and dedupe.
  string message_id = 7;

  // Event timing.
  int64 device_time_unix_ms = 8;
  int64 observed_time_unix_ms = 9;
  int64 ingested_time_unix_ms = 10;

  // Source metadata.
  SourceKind source_kind = 11;
  string source = 12;
  string type_code = 13;

  // Payload schema metadata.
  string payload_type = 14;
  uint32 payload_version = 15;
  PayloadEncoding payload_encoding = 16;

  // Normalized payload body.
  bytes payload = 17;

  // Optional dimensions for filtering/debugging.
  map<string, string> labels = 18;
}

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_MQTT_QUOTA = 1;
  SOURCE_KIND_MQTT_STATUS = 2;
  SOURCE_KIND_REPLAY = 3;
}

enum PayloadEncoding {
  PAYLOAD_ENCODING_UNSPECIFIED = 0;
  PAYLOAD_ENCODING_JSON_UTF8 = 1;
  PAYLOAD_ENCODING_PROTOBUF = 2;
}
